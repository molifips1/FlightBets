<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>flight.bet — predict flight delays</title>
<meta name="description" content="Play-money prediction markets on flight delays." />
<meta name="theme-color" content="#0E2A47" />
<meta property="og:type" content="website" />
<meta property="og:title" content="flight.bet — predict flight delays" />
<meta property="og:description" content="Play-money prediction markets on flight delays." />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#EAEEF3; --card:#FFFFFF; --card2:#F6F8FB; --ink:#0E2A47; --muted:#5E6E80;
  --line:#E3E8EF; --line2:#EEF2F6;
  --brand:#2E6BFF; --brandink:#fff; --hot:#FF5A3C;
  --good:#1FA971; --mid:#F2A310; --warn:#F2701A; --bad:#E8412B;
  --shadow:0 1px 2px rgba(14,42,71,.05), 0 6px 24px rgba(14,42,71,.04);
  --mapsky1:#2E6BFF; --mapsky2:#5A8DFF; --mapsky3:#9DBEFF; --mapgrid:rgba(255,255,255,.16); --mapland:rgba(255,255,255,.06);
}
[data-theme="dark"]{
  --bg:#0A1019; --card:#121C2B; --card2:#0F1825; --ink:#E8EEF6; --muted:#90A2B6;
  --line:#1F2D40; --line2:#18283b;
  --brand:#4F86FF; --hot:#FF6A4D;
  --good:#33C088; --mid:#F2A310; --warn:#FF8A3C; --bad:#FF5945;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 30px rgba(0,0,0,.35);
  --mapsky1:#0B1E3A; --mapsky2:#10325C; --mapsky3:#16447A; --mapgrid:rgba(120,170,255,.14); --mapland:rgba(120,170,255,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,#E9F0F8 0%,var(--bg) 420px) fixed}
[data-theme="dark"] body{background:linear-gradient(180deg,#0C1626 0%,var(--bg) 420px) fixed}
.mono{font-family:'IBM Plex Mono',monospace}
.disp{font-family:Archivo,system-ui,sans-serif}
button{font-family:inherit}
.app{max-width:1240px;margin:0 auto;padding:0 18px 120px}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 84%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);display:flex;align-items:center;justify-content:space-between;
  padding:16px 2px;border-bottom:1px solid var(--line)}
.wm{font-family:Archivo;font-weight:800;font-size:23px;letter-spacing:-.5px;color:var(--ink);display:flex;align-items:center;gap:7px;cursor:pointer}
.wm .pin{color:var(--hot)}
.wm .plane{font-size:17px;transform:translateY(-1px);display:inline-block;transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.wm:hover .plane{transform:translate(4px,-5px) rotate(-12deg)}
.topr{display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--ink);font-size:16px}
.chip{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
  border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 12px;color:var(--ink)}
.chip.bal{background:var(--ink);color:#fff;border-color:var(--ink)}
[data-theme="dark"] .chip.bal{background:var(--brand);border-color:var(--brand)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--hot));border:none;cursor:pointer}

/* ticker */
.ticker{margin-top:12px;background:#0B1118;border:1px solid #1B2737;border-radius:10px;overflow:hidden;position:relative;height:42px;display:flex;align-items:center}
[data-theme="dark"] .ticker{background:#060B13;border-color:#16233a}
.ticker::before{content:"DEPARTURES";position:absolute;left:0;top:0;bottom:0;z-index:2;display:flex;align-items:center;
  padding:0 12px;background:#0B1118;border-right:1px solid #1B2737;color:#5d6f85;
  font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:2px}
.ticker-track{display:flex;gap:34px;white-space:nowrap;animation:scroll 38s linear infinite;padding-left:118px}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#F2B441;display:flex;align-items:center;gap:8px;text-shadow:0 0 6px rgba(242,180,65,.25)}
.tk b{color:#FFD98C;font-weight:500}.tk .win{color:#46d39a;font-weight:600;text-shadow:0 0 6px rgba(70,211,154,.3)}

/* controls */
.controls{display:flex;gap:10px;margin:16px 0 18px}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:0 14px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.search input{flex:1;border:none;outline:none;background:none;font-size:15px;color:var(--ink);padding:13px 0;font-family:inherit}
.search input::placeholder{color:var(--muted)}
.sel,.filter{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:0 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}

/* grid */
.grid{columns:3;column-gap:16px}
@media(max-width:980px){.grid{columns:2}}
@media(max-width:660px){.grid{columns:1}}
.card{break-inside:avoid;position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:17px;margin-bottom:16px;box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-3px) rotate(-.25deg);box-shadow:0 6px 14px rgba(14,42,71,.09),0 22px 48px rgba(14,42,71,.09)}

.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.codeline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.code{font-family:Archivo;font-weight:800;font-size:21px;letter-spacing:-.4px}
.subcode{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);font-weight:500}
.cn{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--hot) 13%,transparent);
  color:var(--hot);font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px}
.pool{font-family:Archivo;font-weight:800;font-size:20px;white-space:nowrap}

/* route */
.route{margin:14px 0 6px}
.stop{display:flex;align-items:center;gap:10px;font-size:14.5px}
.dotline{display:flex;flex-direction:column;align-items:center;width:14px}
.rdot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card)}
.rdot.end{border-color:var(--bad);background:var(--bad)}
.rconn{width:2px;height:18px;background:var(--line);margin:1px 0}
.flag{font-size:13px}
.cc{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;margin-right:2px}
.sname{font-weight:600}
.rtime{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:right}
.rtime .old{color:var(--muted);text-decoration:line-through;font-size:12px;display:block}
.rtime .new{color:var(--bad);font-weight:600}
.haltes{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:7px;padding:2px 8px;margin:2px 0}

/* status + curve */
.statusline{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px}
.statlbl{font-weight:700;font-size:14px}
.statdelay{font-family:Archivo;font-weight:800;font-size:21px}
.curvewrap{margin:6px 0 4px;position:relative}
.curve{display:block;width:100%;height:84px;overflow:visible}
.axis{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px}

/* risk + breakdown */
.riskt{font-size:12.5px;color:var(--muted);margin:12px 0 7px;font-weight:500}
.riskt b{color:var(--ink)}
.rbar{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--line)}
.rbar span{height:100%}
.brk{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:9px}
.bk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.bk .d{width:8px;height:8px;border-radius:50%}
.bk b{color:var(--ink);font-weight:600}

/* footer */
/* footer — the boarding-pass stub. Dashed perforation + punched side
   notches, so betting reads as "tearing off the stub". */
.cfoot{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;
  border-top:1.5px dashed var(--line);position:relative}
.cfoot::before,.cfoot::after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;
  background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.cfoot::before{left:-28px}
.cfoot::after{right:-28px}
.ico{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card2);
  display:grid;place-items:center;cursor:pointer;font-size:15px;color:var(--ink)}
.ico.boost{background:var(--ink);color:#fff;border-color:var(--ink)}
.betbtn{margin-left:auto;border:none;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;
  font-family:'IBM Plex Mono',monospace;background:var(--brand);color:var(--brandink);
  border-radius:10px;padding:12px 24px;transition:filter .15s,transform .1s}
.betbtn:hover{filter:brightness(1.08)}.betbtn:active{transform:scale(.98)}
.betbtn.ghost{background:var(--card2);color:var(--brand);border:1px solid var(--line)}
.betbtn:disabled{background:var(--line);color:var(--muted);cursor:default}

/* daily card */
.daily .q{font-family:Archivo;font-weight:700;font-size:18px;margin:2px 0 4px;line-height:1.25}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--good);
  border:1px solid color-mix(in srgb,var(--good) 35%,transparent);border-radius:6px;padding:3px 7px}
.metaline{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12.5px;margin:8px 0 12px;flex-wrap:wrap}
.bonus{color:var(--warn);font-weight:600}
.ans{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:border-color .15s}
.ans:hover{border-color:var(--brand)}
.ans .al{font-weight:600;display:flex;align-items:center;gap:8px}
.ans .ap{font-family:Archivo;font-weight:800;font-size:17px}

/* discussion card */
.disc .dh{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.msg{margin:13px 0}
.msg .who{font-weight:700;font-size:13.5px}.msg .ago{color:var(--muted);font-size:11px;margin-left:6px}
.msg .tx{font-size:14px;margin-top:2px}
.composer{display:flex;gap:8px;margin-top:12px}
.composer input{flex:1;border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:11px 13px;outline:none;color:var(--ink);font-family:inherit}

/* bet panel */
/* bet panel */
.flightmap{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;background:var(--mapsky2);box-shadow:inset 0 0 30px rgba(0,0,0,.12)}
.fm-code{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;fill:#fff;letter-spacing:.8px;paint-order:stroke;stroke:rgba(0,0,0,.18);stroke-width:2px}
.fm-status{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);padding:7px 12px;border-top:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:6px}
.fm-status .fm-live{color:var(--good);font-weight:600}
.panelbox .flightmap{margin-bottom:0}
.betpanel{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1 1 46%;text-align:left;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--card))}
.opt .ol{font-size:13px;font-weight:600;margin-bottom:5px}
.opt .ox{display:flex;align-items:baseline;justify-content:space-between}
.opt .om{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--brand)}
.opt .op{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}
.stake{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:11px}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:4px;background:var(--line);margin:13px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--brand);cursor:pointer;border:2px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--brand);cursor:pointer;border:2px solid var(--card)}
.ret{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;color:var(--good)}
.note{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);line-height:1.7;margin-top:9px}

/* detail page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;margin:18px 0 14px;background:none;border:none}
.dwrap{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media(max-width:900px){.dwrap{grid-template-columns:1fr}}
.panelbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.dhero{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dtitle{font-family:Archivo;font-weight:800;font-size:30px;letter-spacing:-.6px}
.fares{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.grade{display:flex;align-items:center;gap:13px;background:var(--card2);border-radius:14px;padding:13px 15px;margin-top:14px}
.grade .em{font-size:30px}
.grade .gw{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.5px}
.grade .gb{font-weight:600;font-size:15px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.tile{background:var(--card);padding:15px;text-align:center}
.tile .tl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.tile .tv{font-family:Archivo;font-weight:800;font-size:24px;margin-top:6px}
.sectlbl{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:0 0 10px}
.leader{display:flex;align-items:center;gap:12px;padding:9px 0}
.rank{font-family:Archivo;font-weight:800;font-size:16px;color:var(--muted);width:18px}
.lav{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--hot))}
.lname{font-weight:700;font-size:14px}.lsub{color:var(--muted);font-size:12px}
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.hcode{font-size:12px;color:var(--brand);font-weight:600;background:color-mix(in srgb,var(--brand) 10%,transparent);border-radius:6px;padding:3px 8px}
.hdate{font-weight:700;font-size:13.5px}.hroute{color:var(--muted);font-size:12px}
.hout{margin-left:auto;font-weight:700;font-size:13.5px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(14,42,71,.05)}
.navi{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;background:none;border:none;cursor:pointer;flex:1}
.navi.on{color:var(--brand)}
.navi .ni{font-size:19px}
.fab{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;border:none;display:grid;place-items:center;
  font-size:22px;margin-top:-26px;box-shadow:0 8px 22px color-mix(in srgb,var(--brand) 50%,transparent);cursor:pointer;flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:12px;padding:11px 17px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:60;max-width:92vw;text-align:center}
[data-theme="dark"] .toast{background:#fff;color:#0A1019}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty .e1{font-size:30px}.empty .e2{font-weight:700;margin-top:8px;color:var(--ink)}.empty .e3{font-size:13px;margin-top:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* airports page */
.airports-hero{padding:18px 2px 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.apsuper{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.berhero{margin:14px 0 4px;padding:18px 20px;border-radius:16px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#C8102E,#7A0A1C)}
[data-theme="dark"] .berhero{background:linear-gradient(120deg,#A50D26,#4E0712)}
.berhero::after{content:"✈";position:absolute;right:14px;top:6px;font-size:74px;opacity:.10;transform:rotate(-18deg)}
.berhero-k{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:2px;opacity:.85}
.berhero-t{font-family:Archivo;font-weight:800;font-size:24px;letter-spacing:-.5px;margin-top:6px;line-height:1.1}
.berhero-s{font-size:13px;opacity:.9;margin-top:6px}
.emptyboard{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:14px}
.segmented{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:5px;margin-bottom:16px}
.seg{flex:1;border:none;background:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);
  padding:10px 12px;border-radius:9px;transition:background .15s,color .15s}
.seg:hover{color:var(--ink)}
.seg.on{background:var(--brand);color:#fff}
.aphead{font-family:Archivo;font-weight:800;font-size:32px;letter-spacing:-.6px;margin-top:4px}
.apsub{color:var(--muted);font-size:14px;margin-top:6px;max-width:520px;line-height:1.55}
.sortbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sortpill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;transition:background .15s,color .15s,border-color .15s}
.sortpill:hover{color:var(--ink)}
.sortpill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
[data-theme="dark"] .sortpill.on{background:var(--brand);border-color:var(--brand)}
.aplist{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.aprow{display:grid;grid-template-columns:38px 1fr 110px 110px 24px;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2);cursor:pointer;transition:background .12s,padding-left .15s ease}
.aprow:last-child{border-bottom:none}
.aprow:hover{background:var(--card2);padding-left:22px}
.aprow:hover .apchev{color:var(--brand);transform:translateX(2px)}
.apchev{color:var(--muted);font-size:22px;text-align:right;transition:color .15s,transform .15s}
.apflag{font-size:22px}
.apnames .apcode{font-family:Archivo;font-weight:800;font-size:18px;letter-spacing:-.3px}
.apnames .apname{color:var(--muted);font-size:12.5px;margin-top:1px}
.apstat{text-align:right}
.apstat .aplbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}

const {useState,useEffect,useRef} = React;

/* ----------------------------------------------------------------

 * live data. Leave API_BASE empty for seeded demo mode (also the

const CONFIG = {
  API_BASE: "https://flightbet-proxy.apetersen280.workers.dev",

  REFRESH_AIRPORTS_MS: 15 * 60 * 1000, // 15 min — matches worker cache; cancel share is slow

const RAKE=0.05;
const fmt=n=>Math.round(n).toLocaleString("en-US");
const TONE={good:"var(--good)",mid:"var(--mid)",warn:"var(--warn)",bad:"var(--bad)"};
const STATUS={good:"Pünktlich",mid:"Leicht verspätet",warn:"Verspätet",bad:"Stark verspätet"};
const store={get(k,fb){try{const v=localStorage.getItem(k);return v==null?fb:JSON.parse(v)}catch(e){return fb}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},clear(){try{localStorage.clear()}catch(e){}}};

/* smooth catmull-rom path */
function smooth(pts){
  if(pts.length<2)return"";
  let d=`M ${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function Curve({dist,tone,marker,axis}){
  const W=320,H=80,n=dist.length,max=Math.max(...dist)||1;
  const pts=dist.map((v,i)=>[(i/(n-1))*W, H-(v/max)*(H-10)-4]);
  const line=smooth(pts);
  const area=line+` L ${W},${H} L 0,${H} Z`;
  const col=TONE[tone];
  const mx=marker!=null?(marker/(n-1))*W:null;
  const my=marker!=null?pts[Math.round(marker)]?.[1]:null;
  const uid="g"+Math.random().toString(36).slice(2,7);
  return (
    <div className="curvewrap">
      <svg className="curve" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
        <defs><linearGradient id={uid} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor={col} stopOpacity="0.28"/>
          <stop offset="1" stopColor={col} stopOpacity="0.02"/>
        </linearGradient></defs>
        <path d={area} fill={`url(#${uid})`}/>
        <path d={line} fill="none" stroke={col} strokeWidth="2.4" strokeLinecap="round"/>
        {mx!=null && <g>
          <line x1={mx} y1="0" x2={mx} y2={H} stroke={col} strokeWidth="1.4" strokeDasharray="3 3" opacity="0.55"/>
          <circle cx={mx} cy={my} r="4.5" fill="var(--card)" stroke={col} strokeWidth="2.4"/>
        </g>}
      </svg>
      {axis && <div className="axis">{axis.map((a,i)=><span key={i}>{a}</span>)}</div>}
    </div>
  );
}
function RiskBar({outcomes,total}){
  return <div className="rbar">{outcomes.map(o=>
    <span key={o.id} style={{width:(o.pool/total*100)+"%",background:TONE[o.tone]}}/>)}</div>;
}
function Breakdown({m,total}){
  return <div className="brk">{m.outcomes.map(o=>
    <span className="bk" key={o.id}><span className="d" style={{background:TONE[o.tone]}}/>{o.label} · <b>{Math.round(o.pool/total*100)}%</b></span>)}</div>;
}

];

const TICKER=[
  ["@berliner_jung","LH 1925","+100"],["@tegel4ever","EW 9018","+245"],["@spätzünder","EJU 2261","+80"],
  ["@brandenburg","FR 8542","+100"],["@gatecrasher","LH 1957","+60"],["@verspätet","TÄGLICH","+100"],

function MarketCard({m,total,onOpen,openBet,setOpenBet,pick,setPick,stake,setStake,wallet,onBet,ops,onSettle,positions}){
  if(m.type==="discussion"){
    const msgs=[["berliner_jung","2d","Wie sieht's heute mit den Verspätungen aus?"],["berliner_jung","2d","Morgen zusammen ☕"],
      ["tegel4ever","2d","Interessante Entwicklung am BER."],["tegel4ever","2d","Daumen drücken!"],

    return <div className="card disc">
      <div className="dh"><span>Live-Diskussion</span><span>{msgs.length*25} Kommentare</span></div>
      {msgs.map((x,i)=><div className="msg" key={i}><span className="who">{x[0]}</span><span className="ago">{x[1]}</span><div className="tx">{x[2]}</div></div>)}
      <div className="composer"><input placeholder="Sag deine Meinung…"/><button className="ico">➤</button></div>
    </div>;

    return <div className="card daily">

      {openBet===m.id && <BetPanel m={m} total={t} pick={pick} setPick={setPick} stake={stake} setStake={setStake} wallet={wallet} onBet={onBet} ops={ops} onSettle={onSettle}/>}

        </div>
        <span className="pool">{fmt(total)} €</span>
      </div>

      {isFlight ? (
        <div className="route">
          <div className="stop">
            <div className="dotline"><span className="rdot"/><span className="rconn"/></div>

            <span className="cc">{m.to.cc}</span><span className="flag">{m.to.flag}</span>

      ) : (

      <div className="statusline">

      </div>
      <Curve dist={m.dist} tone={m.status} marker={m.marker} axis={m.axis}/>

      <div className="riskt">{isFlight?"Verspätungsrisiko":"Über-Ziel-Chance"}: <b>{m.risk}%</b></div>
      <RiskBar outcomes={m.outcomes} total={total}/>
      <Breakdown m={m} total={total}/>

      <div className="cfoot" onClick={e=>e.stopPropagation()}>

      </div>

      {open && <div onClick={e=>e.stopPropagation()}><BetPanel m={m} total={total} pick={pick} setPick={setPick} stake={stake} setStake={setStake} wallet={wallet} onBet={onBet} ops={ops} onSettle={onSettle}/></div>}

/* ----------------------------------------------------------------
 * FlightMap — stylized SVG flight map for the bet panel. Draws a
 * region of coastline-free world (a soft graticule), the great-circle-ish
 * route arc between origin and destination, both airport dots, and —
 * when the flight is airborne (live from OpenSky) — a rotating plane
 * glyph at its real position. Falls back to an "on the ground" state
 * with the plane parked at origin when there's no live position.
 * ---------------------------------------------------------------- */
function FlightMap({ m }){
  const [pos, setPos] = useState(null);   // {lat,lon,heading,airborne} | null
  const [state, setState] = useState("loading");

  useEffect(() => {
    if (!m.liveIdent || !CONFIG.API_BASE){ setState("static"); return; }
    let dead = false;
    async function go(){
      try{
        const r = await fetch(`${CONFIG.API_BASE}/api/position?callsign=${encodeURIComponent(m.liveIdent)}`);
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        if (dead) return;
        if (d.airborne && d.lat != null){ setPos(d); setState("airborne"); }
        else { setPos(null); setState("ground"); }
      }catch(e){ if(!dead) setState("static"); }
    }
    go();
    const h = setInterval(go, 30000); // 30s; OpenSky is free
    return () => { dead = true; clearInterval(h); };
  }, [m.liveIdent]);

  if (!m.fromLL || !m.toLL) return null;

  // Equirectangular projection over a bounding box around the route,
  // padded so the arc and plane sit comfortably inside the frame.
  const W = 320, H = 150, pad = 28;
  const lons = [m.fromLL[1], m.toLL[1], pos?.lon].filter(v => v != null);
  const lats = [m.fromLL[0], m.toLL[0], pos?.lat].filter(v => v != null);
  let minLon = Math.min(...lons), maxLon = Math.max(...lons);
  let minLat = Math.min(...lats), maxLat = Math.max(...lats);
  // enforce a minimum span so short routes aren't absurdly zoomed
  const spanLon = Math.max(maxLon - minLon, 12), spanLat = Math.max(maxLat - minLat, 8);
  const cLon = (minLon + maxLon) / 2, cLat = (minLat + maxLat) / 2;
  minLon = cLon - spanLon/2; maxLon = cLon + spanLon/2;
  minLat = cLat - spanLat/2; maxLat = cLat + spanLat/2;
  const px = lon => pad + ( (lon - minLon) / (maxLon - minLon) ) * (W - 2*pad);
  const py = lat => pad + ( (maxLat - lat) / (maxLat - minLat) ) * (H - 2*pad);

  const o = [px(m.fromLL[1]), py(m.fromLL[0])];
  const d = [px(m.toLL[1]),   py(m.toLL[0])];
  // arc control point: midpoint lifted perpendicular for a flight-path curve
  const mid = [(o[0]+d[0])/2, (o[1]+d[1])/2];
  const dx = d[0]-o[0], dy = d[1]-o[1];
  const len = Math.hypot(dx,dy) || 1;
  const lift = Math.min(len*0.18, 34);
  const ctrl = [mid[0] - (dy/len)*lift, mid[1] + (dx/len)*lift];
  const arc = `M ${o[0]},${o[1]} Q ${ctrl[0]},${ctrl[1]} ${d[0]},${d[1]}`;
  const tone = TONE[m.status] || "var(--brand)";

  const plane = pos && state==="airborne" ? [px(pos.lon), py(pos.lat)] : null;
  const uid = "fm"+(m.id||"x");

  return (
    <div className="flightmap">
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" preserveAspectRatio="xMidYMid slice" style={{display:"block"}}>
        <defs>
          <linearGradient id={uid+"sky"} x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stopColor="var(--mapsky1)"/>
            <stop offset="0.55" stopColor="var(--mapsky2)"/>
            <stop offset="1" stopColor="var(--mapsky3)"/>
          </linearGradient>
          <radialGradient id={uid+"glow"} cx="50%" cy="42%" r="70%">
            <stop offset="0" stopColor="#fff" stopOpacity="0.18"/>
            <stop offset="1" stopColor="#fff" stopOpacity="0"/>
          </radialGradient>
          <filter id={uid+"blur"} x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.2"/>
          </filter>
        </defs>
        <rect x="0" y="0" width={W} height={H} fill={`url(#${uid}sky)`}/>
        <rect x="0" y="0" width={W} height={H} fill={`url(#${uid}glow)`}/>
        {/* graticule — curved latitude feel */}
        {[0.18,0.36,0.54,0.72,0.9].map((t,i)=><line key={"v"+i} x1={W*t} y1="0" x2={W*t} y2={H} stroke="var(--mapgrid)" strokeWidth="1"/>)}
        {[0.25,0.5,0.75].map((t,i)=><line key={"h"+i} x1="0" y1={H*t} x2={W} y2={H*t} stroke="var(--mapgrid)" strokeWidth="1"/>)}
        {/* route: soft glow underlay + crisp animated dashes on top */}
        <path d={arc} fill="none" stroke="#fff" strokeWidth="5" strokeLinecap="round" opacity="0.18" filter={`url(#${uid}blur)`}/>
        <path d={arc} fill="none" stroke="#fff" strokeWidth="2.2" strokeDasharray="1 7" strokeLinecap="round" opacity="0.95">
          <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.4s" repeatCount="indefinite"/>
        </path>
        {/* airports — white pins with halo */}
        <g>
          <circle cx={o[0]} cy={o[1]} r="8" fill="#fff" opacity="0.18"/>
          <circle cx={o[0]} cy={o[1]} r="4.5" fill="#fff" stroke="rgba(0,0,0,.12)" strokeWidth="1"/>
          <circle cx={d[0]} cy={d[1]} r="8" fill="#fff" opacity="0.18"/>
          <circle cx={d[0]} cy={d[1]} r="4.5" fill="#fff" stroke="rgba(0,0,0,.12)" strokeWidth="1"/>
          <text x={o[0]} y={o[1]-11} textAnchor="middle" className="fm-code">{m.from?.name?.split(" ").pop()||"DEP"}</text>
          <text x={d[0]} y={d[1]-11} textAnchor="middle" className="fm-code">{m.to?.name?.split(" ").pop()||"ARR"}</text>
        </g>
        {/* plane */}
        {plane && (
          <g transform={`translate(${plane[0]},${plane[1]}) rotate(${(pos.heading||0)})`}>
            <circle r="13" fill="#fff" opacity="0.22"/>
            <circle r="13" fill="none" stroke="#fff" strokeWidth="1" opacity="0.5">
              <animate attributeName="r" from="7" to="15" dur="1.8s" repeatCount="indefinite"/>
              <animate attributeName="opacity" from="0.6" to="0" dur="1.8s" repeatCount="indefinite"/>
            </circle>
            <path d="M0,-8 L2.4,-1 L8,3 L8,5 L1.6,3.2 L1.4,7 L4,9 L4,10.5 L0,9.5 L-4,10.5 L-4,9 L-1.4,7 L-1.6,3.2 L-8,5 L-8,3 L-2.4,-1 Z"
                  fill="#fff" stroke="rgba(0,0,0,.15)" strokeWidth="0.5"/>
          </g>
        )}
        {!plane && (
          <g transform={`translate(${o[0]},${o[1]})`} opacity="0.92">
            <path d="M0,-6 L1.8,-.8 L6,2.2 L6,3.8 L1.2,2.4 L1,5.2 L3,6.8 L3,7.9 L0,7.1 L-3,7.9 L-3,6.8 L-1,5.2 L-1.2,2.4 L-6,3.8 L-6,2.2 L-1.8,-.8 Z"
                  fill="#fff" stroke="rgba(0,0,0,.15)" strokeWidth="0.5" transform="rotate(45)"/>
          </g>
        )}
      </svg>
      <div className="fm-status">
        {state==="loading" && <span>◌ Flugzeug wird geortet…</span>}
        {state==="airborne" && <span className="fm-live">● LIVE · {Math.round((pos.altM||0)/0.3048/100)*100} ft · {Math.round((pos.velocityMs||0)*1.94384)} kt</span>}
        {state==="ground" && <span><Countdown dep={m.depISO} fallback={m.from?.dep}/></span>}
        {state==="static" && <span><Countdown dep={m.depISO} fallback={m.from?.dep}/></span>}
      </div>
    </div>
  );
}

/* Countdown to scheduled departure. Uses m.depISO (full ISO) if present,
   else interprets m.from.dep "HH:MM" as the next occurrence in local time. */
function Countdown({ dep, fallback }){
  const target = useRef(null);
  if (target.current == null){
    let t = null;
    if (dep) t = new Date(dep);
    else if (fallback && /^\d{1,2}:\d{2}$/.test(fallback)){
      const [h,mi] = fallback.split(":").map(Number);
      const now = new Date(); t = new Date(now);
      t.setHours(h, mi, 0, 0);
      if (t < now) t.setDate(t.getDate()+1); // next occurrence
    }
    target.current = t;
  }
  const [now, setNow] = useState(Date.now());
  useEffect(()=>{ const h=setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(h); },[]);
  if (!target.current) return <span>● Am Boden — kein Live-Tracking</span>;
  let diff = Math.floor((target.current - now)/1000);
  if (diff <= 0) return <span className="fm-live">● Gestartet / startet jetzt</span>;
  const hh = Math.floor(diff/3600); diff%=3600;
  const mm = Math.floor(diff/60); const ss = diff%60;
  const pad = n => String(n).padStart(2,"0");
  return <span>🛫 Start in <b style={{color:"var(--ink)"}}>{hh>0?hh+"h ":""}{pad(mm)}m {pad(ss)}s</b></span>;
}

function DailyPage({ markets, total, betProps, openDetail }){

  // Parse the "closes" string into hours-remaining for sorting & hero.

  const hoursLeft = (s) => {

    const h = /(\d+)\s*h/.exec(s); const mn = /(\d+)\s*m/.exec(s);
    return (h?+h[1]:0) + (mn?+mn[1]/60:0);

/* ----------------------------------------------------------------
 * useBoard — pulls the full live BER departures+arrivals board from
 * the worker and turns each flight into a bettable market with
 * deterministic auto-generated pools (so odds are stable per flight
 * across refreshes, seeded from the flight ident). No hand-seeding.
 * ---------------------------------------------------------------- */
const BER_LL = [52.366, 13.503];
// Rough coords for common BER city links so the map has something to draw.
const CITY_LL = {
  FRA:[50.04,8.56], MUC:[48.35,11.79], CGN:[50.87,7.14], DUS:[51.29,6.77],
  HAM:[53.63,10.0], STR:[48.69,9.22], CGN2:[50.87,7.14], VIE:[48.11,16.57],
  ZRH:[47.46,8.55], LHR:[51.47,-0.45], LGW:[51.15,-0.19], STN:[51.88,0.24],
  MAN:[53.35,-2.27], DUB:[53.42,-6.27], BCN:[41.30,2.08], MAD:[40.49,-3.57],
  AMS:[52.31,4.76], CDG:[49.01,2.55], IST:[41.28,28.75], FCO:[41.80,12.25],
  PMI:[39.55,2.74], LIS:[38.77,-9.13], CPH:[55.62,12.65], WAW:[52.17,20.97],
  ATH:[37.94,23.95], MXP:[45.63,8.72], BRU:[50.90,4.48], OSL:[60.19,11.10],
  ARN:[59.65,17.92], HEL:[60.32,24.96], GVA:[46.24,6.11], NCE:[43.66,7.21],
};
// Country of each airport code, used for geographic sorting.
const CITY_COUNTRY = {
  // Germany
  FRA:"DE", MUC:"DE", CGN:"DE", DUS:"DE", HAM:"DE", STR:"DE", TXL:"DE", SXF:"DE",
  NUE:"DE", HAJ:"DE", BRE:"DE", LEJ:"DE", DRS:"DE", FMO:"DE", DTM:"DE", FDH:"DE",
  // Austria
  VIE:"AT", SZG:"AT", INN:"AT", GRZ:"AT", LNZ:"AT", KLU:"AT",
  // Switzerland
  ZRH:"CH", GVA:"CH", BSL:"CH", BRN:"CH", LUG:"CH",
};
// Sort priority: 0 = Germany, 1 = Austria, 2 = Switzerland, 3 = everywhere else.
const GEO_RANK = { DE:0, AT:1, CH:2 };
function geoRank(code){ const c = CITY_COUNTRY[code]; return c!=null ? (GEO_RANK[c] ?? 3) : 3; }
function flagFor(code){
  const c = CITY_COUNTRY[code];
  return c==="DE"?"🇩🇪":c==="AT"?"🇦🇹":c==="CH"?"🇨🇭":"🛬";
}
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0); }
function poolsFor(ident, delayMin, cancelled){
  // Deterministic per-flight pools, nudged by the live delay so odds feel real.
  const seed = hashStr(ident);
  const r = (n)=> (Math.abs((seed>>(n*3)) % 100));
  let base = [40+r(1)%30, 18+r(2)%14, 10+r(3)%10, 6+r(4)%10]; // Pünktlich,+15,+30,+60
  if (cancelled) base = [6,10,14,40];
  else if (delayMin!=null){
    if (delayMin>=60) base=[8,14,20,40];
    else if (delayMin>=30) base=[12,20,30,18];
    else if (delayMin>=15) base=[20,34,18,10];
    else base=[55,20,9,6];
  }
  const scale = 30 + (seed%70); // pool size varies per flight
  return base.map(b=>Math.max(20, Math.round(b*scale/10)));
}
function countryFromICAO(icao){
  if(!icao) return null;
  const p = icao.toUpperCase().slice(0,2);
  if(p==="ED"||p==="ET") return "DE";
  if(p==="LO") return "AT";
  if(p==="LS") return "CH";
  return null;
}
function boardToMarket(f){
  const dirDep = f.direction==="departure";
  const other = dirDep ? f.destination : f.origin;
  const otherCode = other?.code || "???";
  const ll = CITY_LL[otherCode] || null;
  // Prefer ICAO-prefix country (covers every DACH airport), fall back to IATA map.
  const country = countryFromICAO(other?.code_icao) || CITY_COUNTRY[otherCode] || null;
  const otherFlag = country==="DE"?"🇩🇪":country==="AT"?"🇦🇹":country==="CH"?"🇨🇭":flagFor(otherCode);
  const rank = country==="DE"?0:country==="AT"?1:country==="CH"?2:3;
  const status = f.cancelled ? "bad"
    : f.delayMin==null ? "good"
    : f.delayMin>=60 ? "bad" : f.delayMin>=30 ? "warn" : f.delayMin>=15 ? "mid" : "good";
  const delayLabel = f.cancelled ? "ANNULLIERT"
    : f.delayMin==null ? "—" : (f.delayMin>=0?"+":"")+f.delayMin+"m";
  const pools = poolsFor(f.ident, f.delayMin, f.cancelled);
  const fmtT = iso => iso ? new Date(iso).toISOString().slice(11,16) : "—";
  return {
    id: "bd_"+f.ident,
    type: "flight",
    live: true,
    code: f.ident,
    subcode: (f.operator||"") + " · " + (dirDep?"ab BER":"an BER"),
    liveIdent: f.identICAO || f.ident,
    direction: f.direction,
    geoRank: rank,
    otherCode,
    from: dirDep ? {cc:"DE",flag:"🇩🇪",name:"Berlin BER",dep:fmtT(f.scheduledDep)} : {cc:"",flag:otherFlag,name:other?.name||otherCode,dep:fmtT(f.scheduledDep)},
    to:   dirDep ? {cc:"",flag:otherFlag,name:other?.name||otherCode} : {cc:"DE",flag:"🇩🇪",name:"Berlin BER"},
    fromLL: dirDep ? BER_LL : ll,
    toLL:   dirDep ? ll : BER_LL,
    schedArr: fmtT(dirDep ? f.scheduledArr : f.scheduledArr),
    actualArr: fmtT(dirDep ? (f.actualArr||f.scheduledArr) : (f.actualArr||f.scheduledArr)),
    depISO: f.scheduledDep || null,
    stops: 0,
    status,
    delay: delayLabel,
    risk: Math.round(pools.slice(1).reduce((a,b)=>a+b,0) / pools.reduce((a,b)=>a+b,0) * 100),
    dist: status==="bad"?[8,7,5,4,4,6,9,13,16,15,11,7,4,3,2]
         : status==="warn"?[10,9,9,10,12,13,11,9,6,4,3,2,2,1,1]
         : status==="mid"?[6,11,16,15,11,8,6,5,5,5,4,3,2,2,1]
         : [22,17,11,6,4,3,2,2,2,2,3,2,2,2,1],
    marker: status==="bad"?9:status==="warn"?5:status==="mid"?3:1,
    axis:["0m","30m","60m","90m","120m"],
    outcomes:[
      {id:"a",label:"Pünktlich",tone:"good",pool:pools[0]},
      {id:"b",label:"+15m",tone:"mid",pool:pools[1]},
      {id:"c",label:"+30m",tone:"warn",pool:pools[2]},
      {id:"d",label:"+60m",tone:"bad",pool:pools[3]},
    ],
    settles:"FlightAware · tatsächliche Ankunft am Gate",
  };
}

function useBoard(){
  const [flights, setFlights] = useState([]);
  const [status, setStatus] = useState(CONFIG.API_BASE ? "connecting" : "demo");
  const [lastUpdate, setLastUpdate] = useState(null);
  useEffect(()=>{
    if (!CONFIG.API_BASE){ setStatus("demo"); return; }
    let dead=false;
    async function tick(){
      try{
        const r = await fetch(`${CONFIG.API_BASE}/api/board?code=EDDB`);
        if(!r.ok) throw new Error(r.status);
        const d = await r.json();
        if(dead) return;
        setFlights((d.flights||[]).map(boardToMarket));
        setLastUpdate(Date.now());
        setStatus("live");
      }catch(e){ if(!dead) setStatus("offline"); }
    }
    tick();
    const h=setInterval(tick, 30*60*1000); // 30 min — matches worker board cache
    return ()=>{ dead=true; clearInterval(h); };
  },[]);
  return { flights, status, lastUpdate };
}

  }
  function reset(){store.clear();setWallet(925);setPositions({});setView({page:"home"});setToast("Neue Saison — Guthaben zurückgesetzt")}

        {liveMarkets
          .filter(m => dirFilter==="all" || m.direction===dirFilter)
          .filter(m => !query || (m.code+" "+m.subcode+" "+(m.to?.name||"")+" "+(m.from?.name||"")).toLowerCase().includes(query.toLowerCase()))
          .sort((a,b)=>{
            // Germany first, then Austria, then Switzerland, then the rest;
            // within each group keep the soonest scheduled departure first.
            if (a.geoRank !== b.geoRank) return a.geoRank - b.geoRank;
            return new Date(a.depISO||0) - new Date(b.depISO||0);
          })
          .map(m=><MarketCard key={m.id} m={m} total={total(m)} onOpen={id=>setView({page:"detail",id})} {...betProps}/>)}
      </div>
    </> : view.page==="daily" ? (
      <DailyPage markets={dailyMarkets} total={total} betProps={betProps}
        openDetail={id=>setView({page:"detail",id})}/>
    ) : detailMarket ? (
      <Detail m={detailMarket} total={total(detailMarket)} back={()=>{setView({page:"home"});setOpenBet(null)}} {...betProps}/>
    ) : null}

    <div className="nav">
      <button className={"navi"+(tab==="flights"?" on":"")} onClick={()=>{setTab("flights");setView({page:"home"})}}><span className="ni">🛫</span>Flüge</button>
      <button className={"navi"+(tab==="daily"?" on":"")} onClick={()=>{setTab("daily");setView({page:"daily"})}}><span className="ni">📅</span>Täglich</button>
      <button className="fab" onClick={()=>{setTab("flights");setView({page:"home"})}}>⚡</button>
      <button className={"navi"+(tab==="live"?" on":"")} onClick={()=>{setTab("live");setView({page:"home"})}}><span className="ni">📡</span>Live</button>
      <button className={"navi"+(tab==="rank"?" on":"")} onClick={()=>{setTab("rank")}}><span className="ni">🏆</span>Rangliste</button>
    </div>

    {/* dev controls */}
    <div style={{position:"fixed",left:14,bottom:90,zIndex:46,display:"flex",gap:8}}>
      <button className="chip" style={{cursor:"pointer"}} onClick={()=>setOps(v=>!v)}>OPS {ops?"AN":"AUS"}</button>
      <button className="chip" style={{cursor:"pointer"}} onClick={reset}>↺ Reset</button>
    </div>

    {toast && <div className="toast">{toast}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
