  const [bump,setBump]=useState(0); // increment to refetch pools+wallet after a bet
  const [tab,setTab]=useState("flights");
  const { pools: serverPools, settled: serverSettled } = usePools(bump);
  const { user, ready: authReady, signOut } = useAuth();
  const serverWallet = useWallet(bump, user);
  const wallet = serverWallet.balance;
  const leaderboard = useLeaderboard(tab==="rank", bump);
  const [authOpen,setAuthOpen]=useState(false);
  const [feedbackOpen,setFeedbackOpen]=useState(false);
  const [view,setView]=useState({page:"home"});
  const [openBet,setOpenBet]=useState(null);
  const [pick,setPick]=useState(null);
  const [stake,setStake]=useState(100);
  const [ops,setOps]=useState(false);
  const [toast,setToast]=useState(null);
  const [celebrate,setCelebrate]=useState(null);
  const [muted,setMuted]=useState(Sound.muted);
  const [menuOpen,setMenuOpen]=useState(false);
  const [betSheet,setBetSheet]=useState(null); // {marketId, outcomeId} for the quick-bet sheet
  const onQuickBet=(mid,oid)=>{ setBetSheet({marketId:mid, outcomeId:oid}); };
  // --- Browser back/forward support (no URL change) ----------------------
  // Mirror the navigation state (tab / view / menu) into the History API so the
  // browser's back button reverses the last in-app navigation. We push an entry
  // on each change and restore state on popstate, guarding against loops.
  const histInit=useRef(false);
  const fromPop=useRef(false);
  useEffect(()=>{
    const snap={tab,view,menuOpen};
    if(!histInit.current){ histInit.current=true; try{history.replaceState(snap,"");}catch(_){}; return; }
    if(fromPop.current){ fromPop.current=false; return; }
    try{ history.pushState(snap,""); }catch(_){}
  },[tab,view.page,view.id,menuOpen]);
  useEffect(()=>{
    const onPop=(e)=>{
      const s=e.state||{tab:"flights",view:{page:"home"},menuOpen:false};
      fromPop.current=true;
      setTab(s.tab||"flights");
      setView(s.view||{page:"home"});
      setMenuOpen(!!s.menuOpen);
      setOpenBet(null);
    };
    window.addEventListener("popstate",onPop);
    return ()=>window.removeEventListener("popstate",onPop);
  },[]);
  const [streakWelcome,setStreakWelcome]=useState(null);
  const [results,setResults]=useState(null);
  const streak = serverWallet.streak || 0;
  const checkedForRef = useRef(null);
  useEffect(()=>{
    if(!user || !CONFIG.API_BASE) return;
    if(checkedForRef.current===user.id) return; // once per signed-in user
    checkedForRef.current = user.id;
    (async()=>{
      try{
        const r = await authedFetch(`${CONFIG.API_BASE}/api/checkin`, { method:"POST" });
        const d = await r.json();
        if(d && !d.error){
          if(!d.already && d.bonus>0){
            setStreakWelcome({ streak:d.streak, bonus:d.bonus });
            Sound.streak();
          }
          setBump(b=>b+1); // refresh wallet (new balance + streak)
        }
      }catch(_){}
      // Then surface any settled results since last visit.
      try{
        const rr = await authedFetch(`${CONFIG.API_BASE}/api/results`, { method:"POST" });
        const dd = await rr.json();
        if(dd && dd.count>0){ setResults(dd); setBump(b=>b+1); }
      }catch(_){}
    })();
  },[user]);
  const [phaseFilter,setPhaseFilter]=useState("aktiv"); // aktiv | laeuft | ergebnisse

  useEffect(()=>{document.documentElement.setAttribute("data-theme",theme);store.set("fb_theme",theme)},[theme]);
  useEffect(()=>{store.set("fb_lang",lang);try{document.documentElement.setAttribute("lang",lang)}catch(_){}},[lang]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),2600);return()=>clearTimeout(t)},[toast]);

  const total=m=>m.outcomes.reduce((s,o)=>s+o.pool,0);

  // Live BER board → bettable markets.
  const { flights: boardFlights, status: dataStatus, lastUpdate } = useBoard();

  // Apply the REAL shared pools from the server onto each market, and mark a
  // market settled if the server has resolved it. Pools start at €0 and grow as
  // players actually bet — no synthetic numbers.
  const mergeStakes = (mkt) => {
    const p = serverPools[mkt.id] || {};
    const outcomes = mkt.outcomes.map(o => ({...o, pool: p[o.id] || 0}));
    const set = serverSettled[mkt.id];
    const settled = mkt.settled || !!set;
    return {...mkt, outcomes, settled,
            bettable: settled ? false : mkt.bettable, // settled ⇒ never bettable
            settledOutcome: set ? set.outcome : null};
  };
  const morningLine = useMorningLine();
  const closedFlights = useSettled(bump);
  const liveMarkets = boardFlights.map(mergeStakes).map(m => ({ ...m, seed: DEFAULT_SEED }));
  const dailyMarkets = markets.filter(m => m.type==="daily").map(mergeStakes);
  const allFindable = [...liveMarkets, ...dailyMarkets];

  const dataPill = dataStatus === "live"    ? { t:"LIVE",    bg:"var(--good)", fg:"#fff" }
                 : dataStatus === "demo"    ? { t:"DEMO",    bg:"var(--card2)", fg:"var(--muted)" }
                 : dataStatus === "offline" ? { t:"OFFLINE", bg:"var(--bad)",  fg:"#fff" }
                 :                            { t:"…",       bg:"var(--card2)", fg:"var(--muted)" };

  async function onBet(m,o,betStake){
    const s = (betStake!=null) ? betStake : stake;
    if(!user){ setAuthOpen(true); setToast("Zum Wetten bitte anmelden"); return; }
    if(s<=0||s>wallet)return;
    // HARD STOP: once the close time has passed, no bet goes through — even if the
    // card still looks open (it flips on the next refresh, which we trigger here).
    if(m.betCloseISO && Date.now() >= new Date(m.betCloseISO).getTime()){
      setToast(t("Wetten für diesen Flug sind geschlossen","Betting is closed for this flight"));
      setBump(b=>b+1);
      return;
    }
    if(!CONFIG.API_BASE){ setToast("Kein Server verbunden"); return; }
    try{
      const r = await authedFetch(`${CONFIG.API_BASE}/api/bet`, {
        method:"POST", headers:{"content-type":"application/json"},
        body: JSON.stringify({ flightId: m.id, ident: m.code, direction: m.direction, outcome: o.id, stake: s }),
      });
      const d = await r.json();
      if(d.error){
        setToast(d.error==="insufficient_funds"?t("Nicht genug Guthaben","Not enough balance"):d.error==="market_settled"?t("Markt bereits abgerechnet","Market already settled"):d.error==="betting_closed"?t("Wetten für diesen Flug sind geschlossen","Betting is closed for this flight"):d.error==="unauthorized"?t("Bitte neu anmelden","Please sign in again"):t("Wette fehlgeschlagen","Bet failed"));
        return;
      }
      // Success — celebrate. First-ever bet (no prior settled/placed) gets extra flair.
      const firstBet = (serverWallet.balance>=925 && (serverWallet.staked||0)===0);
      Sound.bet();
      setCelebrate({ stake: s, label:o.label, big:firstBet });
      setBump(b=>b+1); // refetch pools + wallet
    }catch(e){ setToast("Wette fehlgeschlagen — Server nicht erreichbar"); }
  }
  // Settlement is automatic on the server. The OPS button is gone.
  function onSettle(){ setToast("Abrechnung läuft automatisch nach der Landung."); }
  function reset(){ setToast("Guthaben wird serverseitig geführt und nicht mehr lokal zurückgesetzt."); }

  const displayName = user ? (user.user_metadata?.name || user.email?.split("@")[0] || "Konto") : null;
  const betProps={openBet,setOpenBet,pick,setPick,stake,setStake,wallet,onBet,ops,onSettle,onQuickBet};
  const detailMarket=view.page==="detail"?allFindable.find(m=>m.id===view.id):null;

  return <div className="app">
    <div className="top">
      <div className="wm" role="button" title="Zu den wettbaren Flügen" onClick={()=>{setTab("flights");setView({page:"home"});setPhaseFilter("aktiv");setMenuOpen(false);}}><span className="plane">✈</span><span className="wmtxt">flug<span className="pin">.</span>bet</span></div>
      <div className="topr">
        {user ? <>
          {streak>0 && <button className="chip streak" style={{cursor:"pointer"}} title="Täglicher Bonus" onClick={()=>{setTab("daily");setView({page:"daily"})}}>🔥 <RollingNumber value={streak} from0/></button>}
          <span className="chip bal">€ <RollingNumber value={wallet}/></span>
          <button className="chip rank-chip" style={{cursor:"pointer"}} onClick={()=>{setTab("rank");setView({page:"home"})}} title="Ranking">🏆 {t("Ranking","Ranking")}</button>
          <button className="chip hide-mobile" style={{cursor:"pointer"}} onClick={()=>setTab("profile")} title="Meine Wetten & Statistik">🎫 {t("Meine Wetten","My bets")}</button>
          <button className="avatar hide-mobile" onClick={()=>setMenuOpen(o=>!o)}/>
        </> : (
          <>
            <button className="chip" style={{cursor:"pointer",background:"var(--brand)",color:"#fff",borderColor:"var(--brand)",fontWeight:700}} onClick={()=>setAuthOpen(true)}>{t("Anmelden","Sign in")}</button>
            <button className="avatar hide-mobile" onClick={()=>setMenuOpen(o=>!o)}/>
          </>
        )}
      </div>
    </div>

    {menuOpen && <>
      <div className="menu-backdrop" onClick={()=>setMenuOpen(false)}/>
      <div className="menu-pop">
        {user ? (
          <div className="menu-head">
            <div className="menu-av">{(displayName||"?")[0].toUpperCase()}</div>
            <div className="menu-id">
              <div className="menu-name">{displayName}</div>
              <div className="menu-role">{t("FLUGGAST","PASSENGER")}</div>
            </div>
          </div>
        ) : (
          <div className="menu-head"><div className="menu-id"><div className="menu-name">{t("Nicht angemeldet","Not signed in")}</div><div className="menu-role">{t("Gast","Guest")}</div></div></div>
        )}
        {user && <div className="menu-pills">
          <div className="menu-pill"><span className="mp-v">€ {fmt(wallet)}</span><span className="mp-l">{t("Guthaben","Balance")}</span></div>
          <div className="menu-pill"><span className="mp-v">Lvl {serverWallet.level||levelForXp(serverWallet.xp||0)}</span><span className="mp-l">{serverWallet.xp||0} XP</span></div>
        </div>}

        <div className="menu-list">
          {user && <button className="menu-item" onClick={()=>{setTab("profile");setMenuOpen(false);}}><span className="mi-i">🎫</span>{t("Meine Wetten","My bets")}</button>}
          {user && <button className="menu-item" onClick={()=>{setTab("daily");setView({page:"daily"});setMenuOpen(false);}}><span className="mi-i">📅</span>{t("Täglicher Bonus","Daily bonus")}</button>}
          <button className="menu-item" onClick={()=>{setTab("settings");setMenuOpen(false);}}><span className="mi-i">⚙️</span>{t("Einstellungen","Settings")}</button>
          <button className="menu-item" onClick={()=>{setTab("legal");setMenuOpen(false);}}><span className="mi-i">📄</span>{t("Impressum & Datenschutz","Legal & privacy")}</button>
          <button className="menu-item" onClick={()=>{setTab("about");setMenuOpen(false);}}><span className="mi-i">ℹ️</span>{t("Über uns","About")}</button>
          <button className="menu-item" onClick={()=>{setMenuOpen(false);setFeedbackOpen(true);}}><span className="mi-i">🐞</span>{t("Fehler melden","Report a bug")}</button>
          <button className="menu-item" onClick={()=>setLang(l=>l==="de"?"en":"de")}><span className="mi-i">🌐</span>{t("Sprache","Language")}<span className="mi-state">{lang==="de"?"DE":"EN"}</span></button>

          <div className="menu-div"/>
          <button className="menu-item" onClick={()=>setTheme(t=>t==="light"?"dark":"light")}><span className="mi-i">{theme==="light"?"🌙":"☀️"}</span>{t("Dunkler Modus","Dark mode")}<span className="mi-state">{theme==="dark"?t("an","on"):t("aus","off")}</span></button>
          <button className="menu-item" onClick={()=>{const v=!muted;setMuted(v);Sound.setMuted(v);if(!v)Sound.select();}}><span className="mi-i">{muted?"🔇":"🔊"}</span>{t("Ton","Sound")}<span className="mi-state">{muted?t("aus","off"):t("an","on")}</span></button>

          {user && <>
            <div className="menu-div"/>
            <button className="menu-item danger" onClick={()=>{setMenuOpen(false);signOut();}}><span className="mi-i">↩</span>{t("Abmelden","Sign out")}</button>
          </>}
        </div>
        <div className="menu-foot">flug.bet · Spielgeld</div>
      </div>
    </>}

    {authOpen && <AuthModal onClose={()=>setAuthOpen(false)}/>}
    {feedbackOpen && <FeedbackModal onClose={()=>setFeedbackOpen(false)} user={user} setToast={setToast}/>}

    {tab==="settings" ? (
      <Settings user={user} theme={theme} setTheme={setTheme} muted={muted} setMuted={setMuted} signOut={signOut} setToast={setToast}/>
    ) : tab==="about" ? (
      <About/>
    ) : tab==="legal" ? (
      <Legal/>
    ) : tab==="profile" ? (
      <>
        <div className="rankhead">
          <h2>👤 Dein Profil</h2>
          <p>Deine Wett-Statistik und offene Wetten.</p>
        </div>
        <Profile wallet={serverWallet} user={user} streak={streak} markets={allFindable}
          onOpen={id=>{setTab("flights");setView({page:"detail",id});}}/>
      </>
    ) : tab==="rank" ? (
      <>
        <div className="rankhead">
          <h2>🏆 Ranking</h2>
          <p>Beste Tipper nach Guthaben — wer aus den Start-925 € am meisten gemacht hat.</p>
        </div>
        <Leaderboard players={leaderboard} me={user?.id}/>
      </>
    ) : view.page==="home" ? <>
      <div className="ticker"><div className="ticker-track">
        {TICKER.concat(TICKER).map((t,i)=><span className="tk" key={i}><span className="win">+{t[2]}€</span><b>{t[0]}</b> auf {t[1]}</span>)}
      </div></div>

      <div className="subfilter">
        <button className={"subpill"+(phaseFilter==="aktiv"?" on":"")} onClick={()=>setPhaseFilter("aktiv")}>● {t("Aktiv","Active")}</button>
        <button className={"subpill"+(phaseFilter==="laeuft"?" on":"")} onClick={()=>setPhaseFilter("laeuft")}>🛫 {t("Läuft","In flight")}</button>
        <button className={"subpill"+(phaseFilter==="ergebnisse"?" on":"")} onClick={()=>setPhaseFilter("ergebnisse")}>🏁 {t("Ergebnisse","Results")}</button>
      </div>

      {dataStatus==="connecting" && (
        <div className="plane-load-wrap"><span className="plane-load">✈</span></div>
      )}
      {(dataStatus==="offline" || dataStatus==="demo") && <div className="emptyboard">
        {dataStatus==="offline"
          ? "Die Live-Tafel ist gerade nicht erreichbar. Der Worker antwortet nicht — Daten erscheinen, sobald er wieder läuft."
          : "Kein Live-Worker verbunden. Trag deine Worker-URL in CONFIG.API_BASE ein, um die echte BER-Tafel zu laden."}
      </div>}

      {(() => {
        // "Ergebnisse": full chronicle from the database (independent of the
        // live board window).
        if (phaseFilter==="ergebnisse") {
          if (closedFlights.loading && closedFlights.rows.length===0) {
            return <div className="emptyboard"><span className="spin spin-d"/> {t("Lade Ergebnisse…","Loading results…")}</div>;
          }
          if (closedFlights.rows.length===0) {
            return <div className="empty"><div className="e1">🏁</div><div className="e2">{t("Noch keine Ergebnisse","No results yet")}</div><div className="e3">{t("Sobald Flüge gelandet und erfasst sind, erscheinen sie hier — mit Ergebnis und (falls darauf gewettet wurde) dem Pool.","Once flights have landed and been recorded, they show up here — with the result and (if bets were placed) the pool.")}</div></div>;
          }
          return <ClosedTable rows={closedFlights.rows}/>;
        }

        // "Läuft": betting closed, flight under way, result still pending — the
        // suspense phase. Cards render locked (no bet button). Soonest-to-resolve
        // (earliest departure) first.
        if (phaseFilter==="laeuft") {
          const running = liveMarkets
            .filter(m => m.tab==="abgeflogen")
            .sort((a,b)=> new Date(a.depISO || 0).getTime() - new Date(b.depISO || 0).getTime());
          if (dataStatus==="live" && running.length===0) {
            return <div className="empty"><div className="e1">🛫</div><div className="e2">{t("Gerade kein Flug unterwegs","No flight under way right now")}</div><div className="e3">{t("Hier erscheinen Flüge, deren Wetten geschlossen sind und die gerade unterwegs sind — das Ergebnis steht noch aus.","Flights whose betting has closed and that are currently in the air show up here — the result is still pending.")}</div></div>;
          }
          return <div className="grid">
            {running.map(m=><MarketCard key={m.id} m={m} total={total(m)} onOpen={(id,pickId)=>{if(pickId)setPick(pickId);setView({page:"detail",id,pick:pickId||null});}} {...betProps}/>)}
          </div>;
        }

        // "Aktiv": bettable flights as cards from the live board — soonest
        // departure first (chronological), bigger pool only as a tiebreaker.
        const shown = liveMarkets
          .filter(m => m.tab==="aktiv")
          .sort((a,b)=>{
            const ta = new Date(a.depISO || 0).getTime();
            const tb = new Date(b.depISO || 0).getTime();
            if (ta !== tb) return ta - tb;
            return total(b) - total(a);
          });
        if (dataStatus==="live" && shown.length===0) {
          return <div className="empty"><div className="e1">🕐</div><div className="e2">{t("Gerade keine wettbaren Flüge","No bettable flights right now")}</div><div className="e3">{t("Wetten schließen 1 Stunde vor Abflug. Aktuell ist kein Flug im offenen Fenster — oft abends, wenn der Flugbetrieb am BER ausläuft. Schau später wieder vorbei.","Betting closes 1 hour before departure. No flight is in the open window right now — often in the evening when BER operations wind down. Check back later.")}</div></div>;
        }
        return <div className="grid">
          {shown.map(m=><MarketCard key={m.id} m={m} total={total(m)} onOpen={(id,pickId)=>{if(pickId)setPick(pickId);setView({page:"detail",id,pick:pickId||null});}} {...betProps}/>)}
        </div>;
      })()}
    </> : view.page==="daily" ? (
      <DailyPage markets={dailyMarkets} total={total} betProps={betProps}
        openDetail={id=>setView({page:"detail",id})}/>
    ) : detailMarket ? (
      <Detail m={detailMarket} total={total(detailMarket)} initialPick={view.pick} back={()=>{setView({page:"home"});setOpenBet(null)}} {...betProps}/>
    ) : null}

    <div className="nav">
      <button className={"navi"+(tab==="flights"?" on":"")} onClick={()=>{setTab("flights");setView({page:"home"})}}><span className="ni">✈️</span>{t("Flüge","Flights")}</button>
      <button className={"navi"+(tab==="profile"?" on":"")} onClick={()=>{ if(user){setTab("profile");setView({page:"home"});} else {setAuthOpen(true);} }}><span className="ni">🎫</span>{t("Wetten","Bets")}</button>
      <button className={"navi"+(tab==="rank"?" on":"")} onClick={()=>{setTab("rank");setView({page:"home"})}}><span className="ni">🏆</span>{t("Ranking","Ranking")}</button>
      <button className={"navi"+(menuOpen?" on":"")} onClick={()=>{setMenuOpen(true)}}><span className="ni">👤</span>{t("Profil","Profile")}</button>
    </div>

    {toast && <div className="toast">{toast}</div>}
    {betSheet && (()=>{ const mk = allFindable.find(x=>x.id===betSheet.marketId); return mk
      ? <BetSheet market={mk} initialOutcome={betSheet.outcomeId} wallet={wallet} onBet={onBet} onClose={()=>setBetSheet(null)}/>
      : null; })()}
    <BetCelebration data={celebrate} onDone={()=>setCelebrate(null)}/>
    {streakWelcome && <div className="celebrate" onClick={()=>setStreakWelcome(null)}>
      <div className="celebrate-card">
        <div className="streak-flame">🔥</div>
        <div className="celebrate-t">{streakWelcome.streak} {streakWelcome.streak===1?"Tag":"Tage"} in Folge!</div>
        <div className="celebrate-s">Willkommen zurück · <b style={{color:"var(--good)"}}>+{streakWelcome.bonus} €</b> Bonus</div>
      </div>
    </div>}
    {!streakWelcome && <ResultsCelebration data={results} onDone={()=>setResults(null)}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
