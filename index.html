<style>
:root{
  --bg:#EAEEF3; --card:#FFFFFF; --card2:#F6F8FB; --ink:#0E2A47; --muted:#5E6E80;
  --line:#E3E8EF; --line2:#EEF2F6;
  --brand:#2E6BFF; --brandink:#fff; --hot:#FF5A3C;
  --good:#1FA971; --mid:#F2A310; --warn:#F2701A; --bad:#E8412B;
  --shadow:0 1px 2px rgba(14,42,71,.05), 0 6px 24px rgba(14,42,71,.04);
  --mapsky1:#2E6BFF; --mapsky2:#5A8DFF; --mapsky3:#9DBEFF; --mapgrid:rgba(255,255,255,.16); --mapland:rgba(255,255,255,.06);
}
[data-theme="dark"]{
  --bg:#0A1019; --card:#121C2B; --card2:#0F1825; --ink:#E8EEF6; --muted:#90A2B6;
  --line:#1F2D40; --line2:#18283b;
  --brand:#4F86FF; --hot:#FF6A4D;
  --good:#33C088; --mid:#F2A310; --warn:#FF8A3C; --bad:#FF5945;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 30px rgba(0,0,0,.35);
  --mapsky1:#0B1E3A; --mapsky2:#10325C; --mapsky3:#16447A; --mapgrid:rgba(120,170,255,.14); --mapland:rgba(120,170,255,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,#E9F0F8 0%,var(--bg) 420px) fixed}
[data-theme="dark"] body{background:linear-gradient(180deg,#0C1626 0%,var(--bg) 420px) fixed}
.mono{font-family:'IBM Plex Mono',monospace}
.disp{font-family:Archivo,system-ui,sans-serif}
button{font-family:inherit}
.app{max-width:1240px;margin:0 auto;padding:0 18px 120px}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 84%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);display:flex;align-items:center;justify-content:space-between;
  padding:16px 2px;border-bottom:1px solid var(--line)}
.wm{font-family:Archivo;font-weight:800;font-size:23px;letter-spacing:-.5px;color:var(--ink);display:flex;align-items:center;gap:7px;cursor:pointer}
.wm .pin{color:var(--hot)}
.wm .plane{font-size:17px;transform:translateY(-1px);display:inline-block;transition:transform .35s cubic-bezier(.3,.7,.3,1)}
.wm:hover .plane{transform:translate(4px,-5px) rotate(-12deg)}
.topr{display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--ink);font-size:16px}
.chip{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
  border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 12px;color:var(--ink)}
.chip.bal{background:var(--ink);color:#fff;border-color:var(--ink)}
[data-theme="dark"] .chip.bal{background:var(--brand);border-color:var(--brand)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--hot));border:none;cursor:pointer}
.menu-backdrop{position:fixed;inset:0;z-index:190}
.menu-pop{position:fixed;top:64px;right:18px;width:300px;max-width:calc(100vw - 24px);z-index:200;
  background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.22);
  overflow:hidden;animation:menupop .16s ease-out}
@keyframes menupop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.menu-head{display:flex;align-items:center;gap:11px;padding:16px}
.menu-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#7c3aed);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.menu-name{font-weight:800;font-size:15px;color:var(--ink)}
.menu-role{font-size:10.5px;letter-spacing:1.2px;color:var(--muted);font-weight:600;margin-top:1px}
.menu-pills{display:flex;gap:8px;padding:0 16px 14px}
.menu-pill{flex:1;background:var(--card2);border-radius:11px;padding:9px 11px;display:flex;flex-direction:column}
.mp-v{font-weight:800;font-size:14px;color:var(--ink)}
.mp-l{font-size:10.5px;color:var(--muted);margin-top:1px}
.menu-list{border-top:1px solid var(--line);padding:6px}
.menu-item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:none;background:none;
  cursor:pointer;font-size:14px;color:var(--ink);font-family:inherit;text-align:left;border-radius:10px;font-weight:500}
.menu-item:hover{background:var(--card2)}
.mi-i{width:20px;text-align:center;font-size:15px;flex:none}
.mi-soon{margin-left:auto;font-size:10.5px;color:var(--muted);background:var(--card2);padding:2px 7px;border-radius:999px;font-weight:600}
.menu-item:hover .mi-soon{background:var(--card)}
.mi-state{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600}
.menu-item.danger{color:var(--bad)}
.menu-div{height:1px;background:var(--line);margin:6px 8px}
.menu-foot{text-align:center;font-size:11px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
.settings{max-width:640px;margin:0 auto}
.set-sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.set-h{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:15px;color:var(--ink)}
.set-field{display:block;margin-bottom:14px}
.set-field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.set-inline{display:flex;gap:8px}
.set-inline input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink);font-family:inherit}
.set-inline input:focus{outline:none;border-color:var(--brand)}
.set-btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:0 16px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.set-btn:disabled{opacity:.6;cursor:default}
.set-hint{display:block;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.toggle{width:46px;height:26px;border-radius:999px;border:none;background:var(--line);cursor:pointer;position:relative;transition:background .2s}
.toggle.on{background:var(--brand)}
.toggle span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on span{left:23px}
.danger-sec{border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.set-del{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
.set-del:disabled{opacity:.6;cursor:default}
.set-confirm{display:flex;flex-direction:column;gap:10px}
.set-confirm>span{font-weight:700;color:var(--ink)}
.set-confirm-row{display:flex;gap:8px}
.set-cancel{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer}

/* ticker */
.ticker{margin-top:12px;background:#0B1118;border:1px solid #1B2737;border-radius:10px;overflow:hidden;position:relative;height:42px;display:flex;align-items:center}
[data-theme="dark"] .ticker{background:#060B13;border-color:#16233a}
.ticker::before{content:"DEPARTURES";position:absolute;left:0;top:0;bottom:0;z-index:2;display:flex;align-items:center;
  padding:0 12px;background:#0B1118;border-right:1px solid #1B2737;color:#5d6f85;
  font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:2px}
.ticker-track{display:flex;gap:34px;white-space:nowrap;animation:scroll 38s linear infinite;padding-left:118px}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#F2B441;display:flex;align-items:center;gap:8px;text-shadow:0 0 6px rgba(242,180,65,.25)}
.tk b{color:#FFD98C;font-weight:500}.tk .win{color:#46d39a;font-weight:600;text-shadow:0 0 6px rgba(70,211,154,.3)}

/* controls */
.controls{display:flex;gap:10px;margin:16px 0 18px}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:0 14px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.search input{flex:1;border:none;outline:none;background:none;font-size:15px;color:var(--ink);padding:13px 0;font-family:inherit}
.search input::placeholder{color:var(--muted)}
.sel,.filter{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:0 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:660px){.grid{grid-template-columns:1fr}}
.card{break-inside:avoid;position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:17px;box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-3px) rotate(-.25deg);box-shadow:0 6px 14px rgba(14,42,71,.09),0 22px 48px rgba(14,42,71,.09)}
/* Interactive bracket rows on the card front (replace the old Wetten button). */
.cbrackets{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.cbk{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border:1px solid var(--line);
  background:var(--card2);border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);
  transition:border-color .15s,transform .1s,background .15s}
.cbk:hover{border-color:var(--brand);background:var(--card)}
.cbk:active{transform:scale(.99)}
.cbk-dot{width:9px;height:9px;border-radius:50%;flex:none}
.cbk-name{font-weight:600}
.cbk-odds{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
/* Neon edge — only in dark mode, where the glow reads. Colour comes from the
   card's --neon (set by flight status: green on-time, red late, etc.). */
[data-theme="dark"] .card.neon{
  border-color:color-mix(in srgb,var(--neon) 65%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--neon) 35%,transparent),
             0 0 16px -3px color-mix(in srgb,var(--neon) 55%,transparent),
             0 0 38px -12px color-mix(in srgb,var(--neon) 50%,transparent);
}
[data-theme="dark"] .card.neon.click:hover{
  transform:translateY(-3px);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--neon) 55%,transparent),
             0 0 22px -2px color-mix(in srgb,var(--neon) 70%,transparent),
             0 0 52px -8px color-mix(in srgb,var(--neon) 60%,transparent);
}
/* One-time "betting just closed" animation: a neon pulse + a light sweep. */
.card.closing{animation:cardClosePulse 1.8s ease-out 1; overflow:hidden}
.card.closing::before{
  content:"";position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;
  background:linear-gradient(115deg,transparent 30%,color-mix(in srgb,var(--neon) 45%,transparent) 50%,transparent 70%);
  transform:translateX(-120%);animation:cardCloseSweep 1.1s ease-out 1}
@keyframes cardCloseSweep{to{transform:translateX(120%)}}
@keyframes cardClosePulse{
  0%{box-shadow:0 0 0 1px color-mix(in srgb,var(--neon) 35%,transparent)}
  18%{box-shadow:0 0 0 2px var(--neon),0 0 26px -1px var(--neon),0 0 60px -6px color-mix(in srgb,var(--neon) 75%,transparent)}
  100%{box-shadow:var(--shadow)}
}
[data-theme="dark"] .card.closing{animation:cardClosePulseDark 1.8s ease-out 1}
@keyframes cardClosePulseDark{
  0%{box-shadow:0 0 0 1px color-mix(in srgb,var(--neon) 35%,transparent)}
  18%{box-shadow:0 0 0 2px var(--neon),0 0 30px 0 var(--neon),0 0 70px -4px color-mix(in srgb,var(--neon) 80%,transparent)}
  100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--neon) 35%,transparent),0 0 16px -3px color-mix(in srgb,var(--neon) 55%,transparent),0 0 38px -12px color-mix(in srgb,var(--neon) 50%,transparent)}
}

.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.codeline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.code{font-family:Archivo;font-weight:800;font-size:21px;letter-spacing:-.4px}
.subcode{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);font-weight:500}
.cn{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--hot) 13%,transparent);
  color:var(--hot);font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px}
.pool{font-family:Archivo;font-weight:800;font-size:20px;white-space:nowrap}

/* route */
.route{margin:14px 0 6px}
.stop{display:flex;align-items:center;gap:10px;font-size:14.5px}
.dotline{display:flex;flex-direction:column;align-items:center;width:14px}
.rdot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card)}
.rdot.end{border-color:var(--bad);background:var(--bad)}
.rconn{width:2px;height:18px;background:var(--line);margin:1px 0}
.flag{font-size:13px}
.cc{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;margin-right:2px}
.sname{font-weight:600}
.rtime{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:right}
.rtime .old{color:var(--muted);text-decoration:line-through;font-size:12px;display:block}
.rtime .new{color:var(--bad);font-weight:600}
.haltes{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:7px;padding:2px 8px;margin:2px 0}

/* status + curve */
.statusline{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px}
.statlbl{font-weight:700;font-size:14px;transition:color .5s ease}
.statdelay{font-family:Archivo;font-weight:800;font-size:21px;transition:color .5s ease}
.curvewrap{margin:6px 0 4px;position:relative}
.curve{display:block;width:100%;height:84px;overflow:visible}
.axis{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px}

/* risk + breakdown */
.riskt{font-size:12.5px;color:var(--muted);margin:12px 0 7px;font-weight:500}
.riskt.nopool{margin:14px 0 4px;font-style:italic;opacity:.85}
.cdrow{margin:10px 0 2px}
.fdate{font-size:11.5px;color:var(--muted);font-weight:500;margin:2px 0 8px;text-transform:capitalize}
.rankhead{margin:18px 0 14px}
.rankhead h2{font-size:24px;font-weight:800;color:var(--ink);margin:0 0 4px}
.rankhead p{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.lb{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lb-h{display:flex;align-items:center;padding:11px 16px;font-size:11px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--card2)}
.lb-row{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px}
.lb-row:last-child{border-bottom:none}
.lb-row.mine{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.lb-rank{width:42px;font-weight:700;color:var(--ink);font-size:15px}
.lb-name{flex:1;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-stat{width:120px;text-align:right;color:var(--ink);font-weight:600}
.lb-stat .lb-sub{color:var(--muted);font-weight:400;font-size:12px}
.lb-bal{width:100px;text-align:right;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.lb-empty{text-align:center;padding:56px 24px;color:var(--muted)}
.lb-emoji{font-size:40px;margin-bottom:12px}
.lb-et{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:6px}
.lb-es{font-size:13.5px;line-height:1.55;max-width:340px;margin:0 auto}

/* ---- Bet celebration micro-interaction ---- */
.celebrate{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;pointer-events:auto;overflow:hidden}
.celebrate-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 34px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.28);animation:pop .4s cubic-bezier(.2,1.2,.4,1)}
.celebrate-check{width:58px;height:58px;border-radius:50%;background:var(--good);color:#fff;font-size:32px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px;animation:checkpop .45s cubic-bezier(.2,1.4,.4,1)}
.celebrate-t{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:4px}
.celebrate-s{font-size:13.5px;color:var(--muted)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes checkpop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.confetti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:.9;
  animation-name:fall;animation-timing-function:cubic-bezier(.35,.1,.5,1);animation-fill-mode:forwards}
@keyframes fall{0%{top:-12px;opacity:1}85%{opacity:.9}100%{top:110vh;opacity:.3}}
.chip.bal{transition:transform .2s ease}
.chip.streak{background:color-mix(in srgb,#f59e0b 16%,transparent);color:#f59e0b;border-color:transparent;font-weight:700}
.chip.lvl{background:color-mix(in srgb,#7c3aed 15%,transparent);color:#7c3aed;border-color:transparent;font-weight:700}
.res-xp{color:#7c3aed;font-weight:700}
.lvlbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:16px}
.lvlbox-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;flex-wrap:wrap;gap:6px}
.lvl-badge{font-weight:800;font-size:15px;color:var(--ink)}
.lvl-xp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvl-bar{height:9px;border-radius:999px;background:var(--card2);overflow:hidden}
.lvl-bar span{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#a855f7);border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.3,1)}
.lvl-hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.streak-flame{font-size:46px;margin-bottom:8px;animation:flamepop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes flamepop{0%{transform:scale(0) rotate(-15deg)}60%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.res-list{margin-top:14px;text-align:left;max-height:230px;overflow-y:auto}
.res-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-size:13px;background:var(--card2);margin-bottom:5px}
.res-row.won{background:color-mix(in srgb,var(--good) 12%,transparent)}
.res-id{font-weight:700;color:var(--ink);width:62px}
.res-tip{flex:1;color:var(--muted)}
.res-pay{font-weight:700;color:var(--good)}
.res-row:not(.won) .res-pay{color:var(--muted)}
.res-more{text-align:center;font-size:12px;color:var(--muted);padding:6px}
.oddsnote{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.oddsnote b{color:var(--ink);font-weight:600}
.rstats{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:14px}
.rstats-h{font-size:12px;font-weight:700;letter-spacing:.3px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.rstats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rstat{text-align:center}
.rstat-v{font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.rstat-l{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
.rstats-empty{font-size:13px;color:var(--muted);line-height:1.55}
.prof-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}

.prof-name{font-size:20px;font-weight:800;color:var(--ink)}
.prof-sub{font-size:14px;color:var(--muted);margin-top:3px;font-weight:700;display:flex;align-items:center}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
.stat-v{font-size:20px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.stat-l{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
.prof-empty{color:var(--muted);font-size:13.5px;padding:8px 2px}
.open-list{display:flex;flex-direction:column;gap:6px}
.open-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);cursor:pointer;font-size:14px;text-align:left;width:100%}
.open-row:hover{border-color:var(--brand)}
.open-code{font-weight:700;color:var(--ink);width:72px}
.open-tip{flex:1;color:var(--muted)}
.open-stake{font-weight:700;color:var(--ink)}
@media(max-width:560px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.legal{max-width:680px;padding-bottom:20px}
.legal-note{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.55;color:var(--ink);margin-bottom:20px}
.legal-sec{margin-bottom:26px}
.legal-sec h3{font-size:18px;font-weight:800;color:var(--ink);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.legal-sec h4{font-size:14px;font-weight:700;color:var(--ink);margin:16px 0 5px}
.legal-sec p{font-size:13.5px;line-height:1.65;color:var(--ink);margin:0 0 10px}
.legal-sec ul{font-size:13.5px;line-height:1.7;color:var(--ink);margin:0 0 10px;padding-left:20px}
.legal-hint{font-size:12px !important;color:var(--muted) !important;font-style:italic;background:var(--card2);padding:9px 12px;border-radius:9px}
.pagefoot{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  margin:28px 0 90px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pf-money{font-weight:600}
.pf-link{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12.5px;font-family:inherit}
.pf-link:hover{color:var(--ink)}
.betcd{font-size:12.5px;color:var(--muted);font-weight:500}
.betcd b{color:var(--ink);font-variant-numeric:tabular-nums}
.betcd.soon{color:var(--bad)}
.betcd.soon b{color:var(--bad)}
.betcd.closed{color:var(--muted);opacity:.8}
.betbtn.locked{background:var(--card2);color:var(--muted);cursor:not-allowed;box-shadow:none}
.riskt b{color:var(--ink)}
.rbar{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--line)}
.rbar span{height:100%;transition:width .6s cubic-bezier(.2,.8,.3,1),background-color .5s ease}
.brk{display:flex;flex-wrap:nowrap;justify-content:space-between;gap:4px;margin-top:9px;overflow:hidden}
.bk{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:0}
.bk .d{width:7px;height:7px;border-radius:50%;flex:none;transition:background-color .5s ease}
.bk b{color:var(--ink);font-weight:600}

/* footer */
/* footer — the boarding-pass stub. Dashed perforation + punched side
   notches, so betting reads as "tearing off the stub". */
.cfoot{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;
  border-top:1.5px dashed var(--line);position:relative}
.cfoot::before,.cfoot::after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;
  background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.cfoot::before{left:-28px}
.cfoot::after{right:-28px}
.ico{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card2);
  display:grid;place-items:center;cursor:pointer;font-size:15px;color:var(--ink)}
.ico.boost{background:var(--ink);color:#fff;border-color:var(--ink)}
.betbtn{margin-left:auto;border:none;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;
  font-family:'IBM Plex Mono',monospace;background:var(--brand);color:var(--brandink);
  border-radius:10px;padding:12px 24px;transition:filter .15s,transform .1s}
.betbtn:hover{filter:brightness(1.08)}.betbtn:active{transform:scale(.98)}
.betbtn.ghost{background:var(--card2);color:var(--brand);border:1px solid var(--line)}
.betbtn:disabled{background:var(--line);color:var(--muted);cursor:default}

/* daily card */
.daily .q{font-family:Archivo;font-weight:700;font-size:18px;margin:2px 0 4px;line-height:1.25}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--good);
  border:1px solid color-mix(in srgb,var(--good) 35%,transparent);border-radius:6px;padding:3px 7px}
.metaline{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12.5px;margin:8px 0 12px;flex-wrap:wrap}
.bonus{color:var(--warn);font-weight:600}
.ans{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:13px 15px;margin-bottom:9px;cursor:pointer;transition:border-color .15s}
.ans:hover{border-color:var(--brand)}
.ans .al{font-weight:600;display:flex;align-items:center;gap:8px}
.ans .ap{font-family:Archivo;font-weight:800;font-size:17px}

/* discussion card */
.disc .dh{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.msg{margin:13px 0}
.msg .who{font-weight:700;font-size:13.5px}.msg .ago{color:var(--muted);font-size:11px;margin-left:6px}
.msg .tx{font-size:14px;margin-top:2px}
.composer{display:flex;gap:8px;margin-top:12px}
.composer input{flex:1;border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:11px 13px;outline:none;color:var(--ink);font-family:inherit}

/* bet panel */
/* bet panel */
.flightmap{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px;background:var(--mapsky2);box-shadow:inset 0 0 30px rgba(0,0,0,.12)}
.fm-code{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;fill:#fff;letter-spacing:.8px;paint-order:stroke;stroke:rgba(0,0,0,.18);stroke-width:2px}
.fm-status{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);padding:7px 12px;border-top:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:6px}
.fm-status .fm-live{color:var(--good);font-weight:600}
.panelbox .flightmap{margin-bottom:0}
.betpanel{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1 1 46%;text-align:left;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--card))}
.opt .ol{font-size:13px;font-weight:600;margin-bottom:5px}
.opt .ox{display:flex;align-items:baseline;justify-content:space-between}
.opt .om{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:var(--brand)}
.opt .op{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}
.stake{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:11px}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:4px;background:var(--line);margin:13px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--brand);cursor:pointer;border:2px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--brand);cursor:pointer;border:2px solid var(--card)}
.ret{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;color:var(--good)}
.note{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);line-height:1.7;margin-top:9px}

/* detail page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;margin:18px 0 14px;background:none;border:none}
.dwrap{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media(max-width:900px){.dwrap{grid-template-columns:1fr}}
.panelbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.dhero{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dtitle{font-family:Archivo;font-weight:800;font-size:30px;letter-spacing:-.6px}
.fares{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.grade{display:flex;align-items:center;gap:13px;background:var(--card2);border-radius:14px;padding:13px 15px;margin-top:14px}
.grade .em{font-size:30px}
.grade .gw{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.5px}
.grade .gb{font-weight:600;font-size:15px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.tile{background:var(--card);padding:15px;text-align:center}
.tile .tl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.tile .tv{font-family:Archivo;font-weight:800;font-size:24px;margin-top:6px}
.sectlbl{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:0 0 10px}
.leader{display:flex;align-items:center;gap:12px;padding:9px 0}
.rank{font-family:Archivo;font-weight:800;font-size:16px;color:var(--muted);width:18px}
.lav{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--hot))}
.lname{font-weight:700;font-size:14px}.lsub{color:var(--muted);font-size:12px}
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.hcode{font-size:12px;color:var(--brand);font-weight:600;background:color-mix(in srgb,var(--brand) 10%,transparent);border-radius:6px;padding:3px 8px}
.hdate{font-weight:700;font-size:13.5px}.hroute{color:var(--muted);font-size:12px}
.hout{margin-left:auto;font-weight:700;font-size:13.5px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(14,42,71,.05)}
.navi{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;background:none;border:none;cursor:pointer;flex:1}
.navi.on{color:var(--brand)}
.navi .ni{font-size:19px}
.fab{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;border:none;display:grid;place-items:center;
  font-size:22px;margin-top:-26px;box-shadow:0 8px 22px color-mix(in srgb,var(--brand) 50%,transparent);cursor:pointer;flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-family:'IBM Plex Mono',monospace;font-size:12px;padding:11px 17px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:60;max-width:92vw;text-align:center}
[data-theme="dark"] .toast{background:#fff;color:#0A1019}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty .e1{font-size:30px}.empty .e2{font-weight:700;margin-top:8px;color:var(--ink)}.empty .e3{font-size:13px;margin-top:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* airports page */
.airports-hero{padding:18px 2px 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.apsuper{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.berhero{margin:14px 0 4px;padding:18px 20px;border-radius:16px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#C8102E,#7A0A1C)}
[data-theme="dark"] .berhero{background:linear-gradient(120deg,#A50D26,#4E0712)}
.berhero::after{content:"✈";position:absolute;right:14px;top:6px;font-size:74px;opacity:.10;transform:rotate(-18deg)}
.berhero-k{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:2px;opacity:.85}
.berhero-t{font-family:Archivo;font-weight:800;font-size:24px;letter-spacing:-.5px;margin-top:6px;line-height:1.1}
.berhero-s{font-size:13px;opacity:.9;margin-top:6px}
.emptyboard{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:14px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;vertical-align:-1px;margin-right:6px;animation:spinrot .7s linear infinite;opacity:.8}
.spin-d{width:13px;height:13px}
@keyframes spinrot{to{transform:rotate(360deg)}}
.segmented{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:5px;margin-bottom:16px}
.phase{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.4px;padding:3px 8px;border-radius:999px;white-space:nowrap}

/* ---- Detail: bracket list ---- */
.brackets{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.bracket{display:grid;grid-template-columns:1fr 1.3fr auto;align-items:center;gap:14px;
  background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;cursor:pointer;
  font-family:inherit;text-align:left;transition:border-color .15s,background .15s}
.bracket:hover{border-color:var(--brand)}
.bracket.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--card))}
.bk-l{display:flex;align-items:center;gap:9px}
.bk-name{font-weight:800;font-size:16px;color:var(--ink)}
.bk-sel{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.5px;
  background:var(--brand);color:#fff;padding:3px 7px;border-radius:999px}
.bk-mid{min-width:0}
.bk-pool{font-size:13px;color:var(--muted);margin-bottom:6px}
.bk-bar{height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.bk-bar span{display:block;height:100%;background:var(--brand);border-radius:999px;min-width:2px;transition:width .6s cubic-bezier(.2,.8,.3,1)}
.bk-odds{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;color:var(--ink);justify-self:end}

/* ---- Detail: stake box ---- */
.pickhint{color:var(--muted);font-size:14px;margin-top:10px;line-height:1.5}
.closedbox{text-align:center;padding:18px 8px 8px}
.closed-em{font-size:30px;line-height:1;margin-bottom:8px}
.closed-t{font-weight:800;font-size:17px;color:var(--ink);margin-bottom:6px}
.closed-s{font-size:13.5px;color:var(--muted);line-height:1.55}

/* ---- Auth modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.45);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:380px;box-shadow:0 24px 70px rgba(0,0,0,.25)}
.modal-h{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:14px}
.authtabs{display:flex;gap:6px;background:var(--card2);border-radius:12px;padding:5px;margin-bottom:16px}
.authtabs button{flex:1;border:none;background:transparent;padding:9px 0;border-radius:9px;font-family:inherit;font-weight:700;font-size:13.5px;color:var(--muted);cursor:pointer}
.authtabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.authinput{width:100%;box-sizing:border-box;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;font-family:inherit;font-size:15px;color:var(--ink);margin-bottom:10px;outline:none}
.authinput:focus{border-color:var(--brand)}
.author{display:flex;align-items:center;gap:12px;margin:14px 0;color:var(--muted);font-size:12px}
.author::before,.author::after{content:"";flex:1;height:1px;background:var(--line)}
.googlebtn{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 0;
  font-family:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.googlebtn:hover{background:var(--card2)}
.authmsg{font-size:13px;line-height:1.5;border-radius:11px;padding:11px 13px;margin-bottom:12px}
.authmsg.ok{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
.authmsg.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.authclose{width:100%;background:none;border:none;color:var(--muted);font-family:inherit;font-size:13px;margin-top:14px;cursor:pointer}
.authlink{width:100%;background:none;border:none;color:var(--brand);font-family:inherit;font-size:13px;font-weight:600;margin-top:10px;cursor:pointer}
.stakebox{margin-top:12px}
.stakerow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.stakelbl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.4px}
.stakeval{font-weight:800;font-size:15px;color:var(--ink)}
.quickadd{display:flex;gap:7px;margin:10px 0 4px}
.quickadd button{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 0;
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer;transition:background .15s}
.quickadd button:hover{background:var(--line)}
.payrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.payrow b{font-size:20px;color:var(--good)}
.paynote{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:8px}

/* ---- Detail: market rules ---- */
.rules{margin-top:4px}
.rules p{font-size:13.5px;line-height:1.6;color:var(--muted);margin:0 0 11px}
.rules b{color:var(--ink)}
.rules-net{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.3px;color:var(--muted);margin-top:2px!important}
.ph-upcoming,.ph-aktiv{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
.ph-enroute,.ph-abgeflogen{background:color-mix(in srgb,var(--mid) 18%,transparent);color:var(--mid)}
.ph-landed,.ph-gelandet{background:var(--card2);color:var(--muted)}
.ph-cancelled{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.seg{flex:1;border:none;background:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);
  padding:10px 12px;border-radius:9px;transition:background .15s,color .15s}
.seg:hover{color:var(--ink)}
.seg.on{background:var(--brand);color:#fff}

// XP → level helpers (mirror the worker). Cumulative XP to reach level L is
// 50*(L-1)*L. Used for the level chip and the profile progress bar.
function xpForLevel(L){ return 50 * (L - 1) * L; }
function levelForXp(xp){ let L = 1; while (xpForLevel(L + 1) <= (xp||0)) L++; return L; }
function levelProgress(xp){
  xp = xp || 0;
  const L = levelForXp(xp);
  const base = xpForLevel(L), next = xpForLevel(L + 1);
  return { level: L, into: xp - base, span: next - base, pct: Math.round((xp - base) / (next - base) * 100) };
}

  history.replaceState(null, "", window.location.pathname + window.location.search + fixed);

const RAKE=0.05;
// DISPLAY-ONLY opening liquidity ("morning line") so the odds (×) never show "—"
// on an empty market. These euros are NOT real money and are NOT used for payouts
// (the worker settles on the real pools only) — they only make the × look alive
// before real bets arrive. Real stakes add on top and shift the odds normally.
// DEFAULT_SEED is the fallback line when we have no history for a flight yet;
// blendSeed() personalises it per flight from collected history.
const DEFAULT_SEED = { a:100, b:60, c:30, d:50 };
const SEED_POOL = DEFAULT_SEED;          // back-compat alias
const SEED_TOTAL = DEFAULT_SEED.a+DEFAULT_SEED.b+DEFAULT_SEED.c+DEFAULT_SEED.d; // 240
const PRIOR_N = 12;                       // how many "virtual" samples the default line is worth
const IDENT_MIN = 8;                      // min flight-number samples before we trust the per-number history over the route

// Build a per-flight morning line from collected history. Blends the default
// line (as a prior) with the flight's own form, sample-weighted: little data →
// stays near the default; lots of data → reflects the real distribution.
// Prefers the specific flight NUMBER once it has enough samples, else the ROUTE.
function blendSeed(ml, ident, dest){
  const defP = { a:DEFAULT_SEED.a/SEED_TOTAL, b:DEFAULT_SEED.b/SEED_TOTAL, c:DEFAULT_SEED.c/SEED_TOTAL, d:DEFAULT_SEED.d/SEED_TOTAL };
  const identH = ml && ml.byIdent && ml.byIdent[ident];
  const destH  = ml && ml.byDest  && ml.byDest[dest];
  const hist = (identH && identH.n >= IDENT_MIN) ? identH : (destH && destH.n > 0 ? destH : null);
  let wa=PRIOR_N*defP.a, wb=PRIOR_N*defP.b, wc=PRIOR_N*defP.c, wd=PRIOR_N*defP.d;
  if(hist){ wa+=hist.a; wb+=hist.b; wc+=hist.c; wd+=hist.d; }
  const tot = wa+wb+wc+wd || 1;
  return { a:SEED_TOTAL*wa/tot, b:SEED_TOTAL*wb/tot, c:SEED_TOTAL*wc/tot, d:SEED_TOTAL*wd/tot };
}

function displayOdds(outcomes, o, seed){
  const S = seed || DEFAULT_SEED;
  const eff = oo => (oo.pool||0) + (S[oo.id]||0);
  const tot = outcomes.reduce((s,oo)=>s+eff(oo),0);
  const mine = eff(o);
  return mine>0 ? tot/mine : null;
}

const USER_ID = getUserId();

/* smooth catmull-rom path */
function smooth(pts){
  if(pts.length<2)return"";
  let d=`M ${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function Curve({dist,tone,marker,axis}){
  const W=320,H=80,n=dist.length,max=Math.max(...dist)||1;
  const pts=dist.map((v,i)=>[(i/(n-1))*W, H-(v/max)*(H-10)-4]);
  const line=smooth(pts);
  const area=line+` L ${W},${H} L 0,${H} Z`;
  const col=TONE[tone];
  const mx=marker!=null?(marker/(n-1))*W:null;
  const my=marker!=null?pts[Math.round(marker)]?.[1]:null;
  const uid="g"+Math.random().toString(36).slice(2,7);
  return (
    <div className="curvewrap">
      <svg className="curve" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
        <defs><linearGradient id={uid} x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor={col} stopOpacity="0.28"/>
          <stop offset="1" stopColor={col} stopOpacity="0.02"/>
        </linearGradient></defs>
        <path d={area} fill={`url(#${uid})`}/>
        <path d={line} fill="none" stroke={col} strokeWidth="2.4" strokeLinecap="round"/>
        {mx!=null && <g>
          <line x1={mx} y1="0" x2={mx} y2={H} stroke={col} strokeWidth="1.4" strokeDasharray="3 3" opacity="0.55"/>
          <circle cx={mx} cy={my} r="4.5" fill="var(--card)" stroke={col} strokeWidth="2.4"/>
        </g>}
      </svg>
      {axis && <div className="axis">{axis.map((a,i)=><span key={i}>{a}</span>)}</div>}

  );
}
// Live pool-distribution curve: the REAL euro on each delay bucket, smoothed
// into a curve. Shape moves with every bet — the crowd's view of this flight.
// The leading bucket (most money) is marked. Empty pool → flat baseline.
function PoolCurve({outcomes,total,seed}){
  // Use the same opening line (seed) as the odds, so the distribution curve
  // shows a sensible shape immediately and shifts as real bets come in —
  // instead of sitting flat on an empty market.
  const S = seed || DEFAULT_SEED;
  const eff = o => (o.pool||0) + (S[o.id]||0);
  const vals = outcomes.map(eff);
  const effTotal = vals.reduce((a,b)=>a+b,0);
  const hasMoney = effTotal>0 && Math.max(...vals)>0;
  const leadIdx = hasMoney ? vals.indexOf(Math.max(...vals)) : 0;
  const tone = outcomes[leadIdx]?.tone || "good";
  const axis = outcomes.map(o=>o.label);
  const dist = hasMoney ? vals : vals.map(()=>0.0001);
  return <Curve dist={dist} tone={hasMoney?tone:"muted"} marker={hasMoney?leadIdx:null} axis={axis}/>;
}

function Breakdown({m,total}){

  if(m.type==="daily"){
    const t=m.outcomes.reduce((s,o)=>s+o.pool,0);
    return <div className="card daily">
      <div className="chead"><span className="tag">OPEN</span></div>
      <div className="q">{m.question}</div>

      <div className="metaline"><span>⏳ Schließt in <b style={{color:"var(--ink)"}}>{m.closes}</b></span><span className="bonus">⚡ {m.bonus}</span></div>
      {m.outcomes.map(o=><div className="ans" key={o.id} onClick={()=>{setOpenBet(m.id);setPick(o.id)}}>
        <span className="al">{o.tone==="good"?"🔥":"❄️"} {o.label}</span><span className="ap">{t>0?Math.round(o.pool/t*100)+"%":"—"}</span></div>)}
      {openBet===m.id && <BetPanel m={m} total={t} pick={pick} setPick={setPick} stake={stake} setStake={setStake} wallet={wallet} onBet={onBet} ops={ops} onSettle={onSettle}/>}
    </div>;
  }
  const isFlight=m.type==="flight";
  const open=openBet===m.id;
  // Play a one-time "betting just closed" animation when this card transitions
  // Play a one-time "betting just closed" animation the moment the live countdown
  // reaches zero WHILE the card is on screen. We schedule it off the real close
  // time (not the board's stale `bettable` flag, which only updates on refetch —
  // and which would also move the card to another tab, so it could never show).
  const [closing,setClosing]=useState(false);
  useEffect(()=>{
    if(!m.bettable || !m.betCloseISO) return;

    if(isNaN(ms) || ms<=0 || ms>24*60*60*1000) return; // skip if already closed or absurdly far
    let t2;
    const t1=setTimeout(()=>{ setClosing(true); t2=setTimeout(()=>setClosing(false),1800); }, ms);
    return ()=>{ clearTimeout(t1); clearTimeout(t2); };

  return (
    <div className={"card click neon"+(closing?" closing":"")} style={{"--neon": TONE[m.status] || "var(--brand)"}} onClick={()=>onOpen(m.id)}>
      <div className="chead">
        <div className="codeline">
          <span className="code">{m.code}</span>
          {m.phase && <span className={"phase ph-"+(m.tab||m.phase)}>{

            m.phase==="landed"    ? "✓ gelandet" :
            m.phase==="enroute"   ? "✈ abgeflogen" :
            m.bettable            ? "● bevorstehend" :

      {isFlight && m.dateLabel && <div className="fdate">{m.dateLabel}</div>}

            <span className="flag">{m.from.flag}</span>

          </div>
          {m.stops>0 && <div style={{paddingLeft:24}}><span className="haltes">{m.stops} stops ▾</span></div>}

      ) : (
        <div className="scope" style={{margin:"12px 0 2px",color:"var(--muted)",fontSize:14}}>{m.scope}</div>
      )}

      <div className="statusline">
        <span className="statlbl" style={{color:m.delayUnknown?"var(--muted)":TONE[m.status]}}>{isFlight?(m.delayUnknown?"Status unbekannt":STATUS[m.status]):"Laufende Quote"}</span>
        <span className="statdelay" style={{color:m.delayUnknown?"var(--muted)":TONE[m.status]}}>{m.delay}</span>
      </div>

      <PoolCurve outcomes={m.outcomes} total={total} seed={m.seed}/>

      {total>0 && <RiskBar outcomes={m.outcomes} total={total}/>}

      {m.bettable && <div className="cdrow"><BetCountdown closeISO={m.betCloseISO}/></div>}

      {m.bettable
        ? <div className="cbrackets" onClick={e=>e.stopPropagation()}>
            {m.outcomes.map(o=>{
              const odds = displayOdds(m.outcomes, o, m.seed);
              return <button key={o.id} className="cbk" onClick={(e)=>{e.stopPropagation(); onQuickBet(m.id,o.id);}}>
                <span className="cbk-dot" style={{background:TONE[o.tone]}}/>
                <span className="cbk-name">{o.label}</span>
                <span className="cbk-odds">{odds!=null?odds.toFixed(2)+"×":"—"}</span>
              </button>;
            })}
          </div>
        : <div className="cfoot"><button className="betbtn locked" disabled>{m.phase==="cancelled"?"Annulliert":m.phase==="landed"?"Gelandet":m.phase==="enroute"?"Abgeflogen":"Geschlossen"}</button></div>}
    </div>
  );
}

/* ----------------------------------------------------------------
 * FlightMap — stylized SVG flight map for the bet panel. Draws a
 * region of coastline-free world (a soft graticule), the great-circle-ish
 * route arc between origin and destination, both airport dots, and —
 * when the flight is airborne (live from OpenSky) — a rotating plane
 * glyph at its real position. Falls back to an "on the ground" state
 * with the plane parked at origin when there's no live position.
 * ---------------------------------------------------------------- */
function FlightMap({ m }){
  const [pos, setPos] = useState(null);   // {lat,lon,heading,airborne} | null
  const [state, setState] = useState("loading");

  useEffect(() => {
    if (!m.liveIdent || !CONFIG.API_BASE){ setState("static"); return; }
    let dead = false;
    async function go(){
      try{
        const r = await fetch(`${CONFIG.API_BASE}/api/position?callsign=${encodeURIComponent(m.liveIdent)}`);
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        if (dead) return;
        if (d.airborne && d.lat != null){ setPos(d); setState("airborne"); }
        else { setPos(null); setState("ground"); }
      }catch(e){ if(!dead) setState("static"); }
    }
    go();
    const h = setInterval(go, 30000); // 30s; OpenSky is free
    return () => { dead = true; clearInterval(h); };
  }, [m.liveIdent]);

  if (!m.fromLL || !m.toLL) return null;

  // Equirectangular projection over a bounding box around the route,
  // padded so the arc and plane sit comfortably inside the frame.
  const W = 320, H = 150, pad = 28;
  const lons = [m.fromLL[1], m.toLL[1], pos?.lon].filter(v => v != null);
  const lats = [m.fromLL[0], m.toLL[0], pos?.lat].filter(v => v != null);
  let minLon = Math.min(...lons), maxLon = Math.max(...lons);
  let minLat = Math.min(...lats), maxLat = Math.max(...lats);
  // enforce a minimum span so short routes aren't absurdly zoomed
  const spanLon = Math.max(maxLon - minLon, 12), spanLat = Math.max(maxLat - minLat, 8);
  const cLon = (minLon + maxLon) / 2, cLat = (minLat + maxLat) / 2;
  minLon = cLon - spanLon/2; maxLon = cLon + spanLon/2;
  minLat = cLat - spanLat/2; maxLat = cLat + spanLat/2;
  const px = lon => pad + ( (lon - minLon) / (maxLon - minLon) ) * (W - 2*pad);
  const py = lat => pad + ( (maxLat - lat) / (maxLat - minLat) ) * (H - 2*pad);

  const o = [px(m.fromLL[1]), py(m.fromLL[0])];
  const d = [px(m.toLL[1]),   py(m.toLL[0])];
  // arc control point: midpoint lifted perpendicular for a flight-path curve
  const mid = [(o[0]+d[0])/2, (o[1]+d[1])/2];
  const dx = d[0]-o[0], dy = d[1]-o[1];
  const len = Math.hypot(dx,dy) || 1;
  const lift = Math.min(len*0.18, 34);
  const ctrl = [mid[0] - (dy/len)*lift, mid[1] + (dx/len)*lift];
  const arc = `M ${o[0]},${o[1]} Q ${ctrl[0]},${ctrl[1]} ${d[0]},${d[1]}`;
  const tone = TONE[m.status] || "var(--brand)";

  const plane = pos && state==="airborne" ? [px(pos.lon), py(pos.lat)] : null;
  const uid = "fm"+(m.id||"x");

  return (
    <div className="flightmap">
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" preserveAspectRatio="xMidYMid slice" style={{display:"block"}}>
        <defs>
          <linearGradient id={uid+"sky"} x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stopColor="var(--mapsky1)"/>
            <stop offset="0.55" stopColor="var(--mapsky2)"/>
            <stop offset="1" stopColor="var(--mapsky3)"/>
          </linearGradient>
          <radialGradient id={uid+"glow"} cx="50%" cy="42%" r="70%">
            <stop offset="0" stopColor="#fff" stopOpacity="0.18"/>
            <stop offset="1" stopColor="#fff" stopOpacity="0"/>
          </radialGradient>
          <filter id={uid+"blur"} x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.2"/>
          </filter>
        </defs>
        <rect x="0" y="0" width={W} height={H} fill={`url(#${uid}sky)`}/>
        <rect x="0" y="0" width={W} height={H} fill={`url(#${uid}glow)`}/>
        {/* graticule — curved latitude feel */}
        {[0.18,0.36,0.54,0.72,0.9].map((t,i)=><line key={"v"+i} x1={W*t} y1="0" x2={W*t} y2={H} stroke="var(--mapgrid)" strokeWidth="1"/>)}
        {[0.25,0.5,0.75].map((t,i)=><line key={"h"+i} x1="0" y1={H*t} x2={W} y2={H*t} stroke="var(--mapgrid)" strokeWidth="1"/>)}
        {/* route: soft glow underlay + crisp animated dashes on top */}
        <path d={arc} fill="none" stroke="#fff" strokeWidth="5" strokeLinecap="round" opacity="0.18" filter={`url(#${uid}blur)`}/>
        <path d={arc} fill="none" stroke="#fff" strokeWidth="2.2" strokeDasharray="1 7" strokeLinecap="round" opacity="0.95">
          <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.4s" repeatCount="indefinite"/>
        </path>
        {/* airports — white pins with halo */}
        <g>
          <circle cx={o[0]} cy={o[1]} r="8" fill="#fff" opacity="0.18"/>
          <circle cx={o[0]} cy={o[1]} r="4.5" fill="#fff" stroke="rgba(0,0,0,.12)" strokeWidth="1"/>
          <circle cx={d[0]} cy={d[1]} r="8" fill="#fff" opacity="0.18"/>
          <circle cx={d[0]} cy={d[1]} r="4.5" fill="#fff" stroke="rgba(0,0,0,.12)" strokeWidth="1"/>
          <text x={o[0]} y={o[1]-11} textAnchor="middle" className="fm-code">{m.from?.name?.split(" ").pop()||"DEP"}</text>
          <text x={d[0]} y={d[1]-11} textAnchor="middle" className="fm-code">{m.to?.name?.split(" ").pop()||"ARR"}</text>
        </g>
        {/* plane */}
        {plane && (
          <g transform={`translate(${plane[0]},${plane[1]}) rotate(${(pos.heading||0)})`}>
            <circle r="13" fill="#fff" opacity="0.22"/>
            <circle r="13" fill="none" stroke="#fff" strokeWidth="1" opacity="0.5">
              <animate attributeName="r" from="7" to="15" dur="1.8s" repeatCount="indefinite"/>
              <animate attributeName="opacity" from="0.6" to="0" dur="1.8s" repeatCount="indefinite"/>
            </circle>
            <path d="M0,-8 L2.4,-1 L8,3 L8,5 L1.6,3.2 L1.4,7 L4,9 L4,10.5 L0,9.5 L-4,10.5 L-4,9 L-1.4,7 L-1.6,3.2 L-8,5 L-8,3 L-2.4,-1 Z"
                  fill="#fff" stroke="rgba(0,0,0,.15)" strokeWidth="0.5"/>
          </g>
        )}
        {!plane && (
          <g transform={`translate(${o[0]},${o[1]})`} opacity="0.92">
            <path d="M0,-6 L1.8,-.8 L6,2.2 L6,3.8 L1.2,2.4 L1,5.2 L3,6.8 L3,7.9 L0,7.1 L-3,7.9 L-3,6.8 L-1,5.2 L-1.2,2.4 L-6,3.8 L-6,2.2 L-1.8,-.8 Z"
                  fill="#fff" stroke="rgba(0,0,0,.15)" strokeWidth="0.5" transform="rotate(45)"/>
          </g>
        )}
      </svg>
      <div className="fm-status">
        {state==="loading" && <span>◌ Flugzeug wird geortet…</span>}
        {state==="airborne" && <span className="fm-live">● LIVE · {Math.round((pos.altM||0)/0.3048/100)*100} ft · {Math.round((pos.velocityMs||0)*1.94384)} kt</span>}
        {state==="ground" && <span><Countdown dep={m.depISO} fallback={m.from?.dep}/></span>}
        {state==="static" && <span><Countdown dep={m.depISO} fallback={m.from?.dep}/></span>}
      </div>
    </div>
  );
}

/* Countdown to scheduled departure. Uses m.depISO (full ISO) if present,
   else interprets m.from.dep "HH:MM" as the next occurrence in local time. */
function Countdown({ dep, fallback }){
  const target = useRef(null);
  if (target.current == null){
    let t = null;
    if (dep) t = new Date(dep);
    else if (fallback && /^\d{1,2}:\d{2}$/.test(fallback)){
      const [h,mi] = fallback.split(":").map(Number);
      const now = new Date(); t = new Date(now);
      t.setHours(h, mi, 0, 0);
      if (t < now) t.setDate(t.getDate()+1); // next occurrence
    }
    target.current = t;
  }
  const [now, setNow] = useState(Date.now());
  useEffect(()=>{ const h=setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(h); },[]);
  if (!target.current) return <span>● Am Boden — kein Live-Tracking</span>;
  let diff = Math.floor((target.current - now)/1000);
  if (diff <= 0) return <span className="fm-live">● Gestartet / startet jetzt</span>;
  const hh = Math.floor(diff/3600); diff%=3600;
  const mm = Math.floor(diff/60); const ss = diff%60;
  const pad = n => String(n).padStart(2,"0");
  return <span>🛫 Start in <b style={{color:"var(--ink)"}}>{hh>0?hh+"h ":""}{pad(mm)}m {pad(ss)}s</b></span>;
}

// Live countdown to the betting deadline (90 min before departure). Drives the
// urgency: "⏳ Wetten schließt in 23 Min". Turns red in the final 15 minutes.
function BetCountdown({ closeISO }){
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{ const h=setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(h); },[]);
  if(!closeISO) return null;
  const diff = Math.floor((new Date(closeISO).getTime()-now)/1000);
  if(diff<=0) return <span className="betcd closed">🔒 Wetten geschlossen</span>;
  const hh=Math.floor(diff/3600), mm=Math.floor((diff%3600)/60), ss=diff%60;
  const pad=n=>String(n).padStart(2,"0");
  const soon = diff < 15*60; // last 15 min → urgent
  return <span className={"betcd"+(soon?" soon":"")}>
    ⏳ Wetten schließt in <b>{hh>0?hh+"h ":""}{pad(mm)}:{pad(ss)}</b>
  </span>;
}

// Route reliability panel (BER → dest), shown on the detail page. Honest empty

/* ----------------------------------------------------------------
 * DailyPage — the dedicated Daily Questions tab. Today's open
 * questions stacked in a focused single-column feed, plus a
 * "closing soon" hero pulled from the question with the shortest
 * close time.
 * ---------------------------------------------------------------- */
function DailyPage({ markets, total, betProps, openDetail }){
  const daily = markets.filter(m => m.type === "daily");

  // Parse the "closes" string into hours-remaining for sorting & hero.
  // Format is like "14h 26m" or "3h 17m" — best-effort.
  const hoursLeft = (s) => {
    if (!s) return 999;
    const h = /(\d+)\s*h/.exec(s); const mn = /(\d+)\s*m/.exec(s);
    return (h?+h[1]:0) + (mn?+mn[1]/60:0);
  };
  const sorted = [...daily].sort((a,b) => hoursLeft(a.closes) - hoursLeft(b.closes));
  const hero = sorted[0];
  const rest = sorted.slice(1);

  return <div>
    <div className="airports-hero">
      <div>
        <div className="apsuper">{daily.length} Fragen · heute</div>
        <div className="aphead">Tägliche Fragen</div>
        <div className="apsub">Jeden Tag neue Fragen rund um den BER, mit fester Schlusszeit. Frühe Wetten bekommen einen Bonus-Multiplikator — je näher am Schluss, desto geringer die Quote. Jede Frage wird über eine offizielle Kennzahl abgerechnet.</div>
      </div>
    </div>

    {hero && <div className="daily-hero">
      <div className="dh-tag">⏰ Schließt als nächstes · in {hero.closes}</div>
      <div className="dh-q">{hero.question}</div>
      <div className="dh-meta"><span>{hero.yesterday}</span><span className="dh-bonus">⚡ {hero.bonus}</span></div>
      <div className="dh-chips">
        {hero.outcomes.map(o => {
          const t = total(hero) || 1;
          return <button key={o.id} className="dh-opt" onClick={()=>openDetail(hero.id)}>
            <span className="dh-l">{o.label}</span>
            <span className="dh-p" style={{color:TONE[o.tone]}}>{Math.round(o.pool/t*100)}%</span>
          </button>;
        })}
      </div>
      <button className="dh-place" onClick={()=>openDetail(hero.id)}>Frage öffnen →</button>

    <div className="sectlbl" style={{margin:"22px 2px 12px"}}>Weitere offene Fragen</div>
    <div className="grid">
      {rest.map(m=><MarketCard key={m.id} m={m} total={total(m)} onOpen={openDetail} {...betProps}/>)}
    </div>
  </div>;
}

/* ----------------------------------------------------------------
 * useBoard — pulls the full live BER departures+arrivals board from
 * the worker and turns each flight into a bettable market with
 * deterministic auto-generated pools (so odds are stable per flight
 * across refreshes, seeded from the flight ident). No hand-seeding.
 * ---------------------------------------------------------------- */
const BER_LL = [52.366, 13.503];
// Rough coords for common BER city links so the map has something to draw.
const CITY_LL = {
  FRA:[50.04,8.56], MUC:[48.35,11.79], CGN:[50.87,7.14], DUS:[51.29,6.77],
  HAM:[53.63,10.0], STR:[48.69,9.22], CGN2:[50.87,7.14], VIE:[48.11,16.57],
  ZRH:[47.46,8.55], LHR:[51.47,-0.45], LGW:[51.15,-0.19], STN:[51.88,0.24],
  MAN:[53.35,-2.27], DUB:[53.42,-6.27], BCN:[41.30,2.08], MAD:[40.49,-3.57],
  AMS:[52.31,4.76], CDG:[49.01,2.55], IST:[41.28,28.75], FCO:[41.80,12.25],
  PMI:[39.55,2.74], LIS:[38.77,-9.13], CPH:[55.62,12.65], WAW:[52.17,20.97],
  ATH:[37.94,23.95], MXP:[45.63,8.72], BRU:[50.90,4.48], OSL:[60.19,11.10],
  ARN:[59.65,17.92], HEL:[60.32,24.96], GVA:[46.24,6.11], NCE:[43.66,7.21],
};
// Country of each airport code, used for geographic sorting.
const CITY_COUNTRY = {
  // Germany
  FRA:"DE", MUC:"DE", CGN:"DE", DUS:"DE", HAM:"DE", STR:"DE", TXL:"DE", SXF:"DE",
  NUE:"DE", HAJ:"DE", BRE:"DE", LEJ:"DE", DRS:"DE", FMO:"DE", DTM:"DE", FDH:"DE",
  // Austria
  VIE:"AT", SZG:"AT", INN:"AT", GRZ:"AT", LNZ:"AT", KLU:"AT",
  // Switzerland
  ZRH:"CH", GVA:"CH", BSL:"CH", BRN:"CH", LUG:"CH",
};
// Sort priority: 0 = Germany, 1 = Austria, 2 = Switzerland, 3 = everywhere else.
const GEO_RANK = { DE:0, AT:1, CH:2 };
function geoRank(code){ const c = CITY_COUNTRY[code]; return c!=null ? (GEO_RANK[c] ?? 3) : 3; }
function flagFor(code){
  const c = CITY_COUNTRY[code];
  return c==="DE"?"🇩🇪":c==="AT"?"🇦🇹":c==="CH"?"🇨🇭":"🛬";
}
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0); }
function poolsFor(ident, delayMin, cancelled){
  // Deterministic per-flight pools, nudged by the live delay so odds feel real.
  const seed = hashStr(ident);
  const r = (n)=> (Math.abs((seed>>(n*3)) % 100));
  let base = [40+r(1)%30, 18+r(2)%14, 10+r(3)%10, 6+r(4)%10]; // Pünktlich,+15,+30,+60
  if (cancelled) base = [6,10,14,40];
  else if (delayMin!=null){
    if (delayMin>=60) base=[8,14,20,40];
    else if (delayMin>=30) base=[12,20,30,18];
    else if (delayMin>=15) base=[20,34,18,10];
    else base=[55,20,9,6];
  }
  const scale = 30 + (seed%70); // pool size varies per flight
  return base.map(b=>Math.max(20, Math.round(b*scale/10)));
}
function countryFromICAO(icao){
  if(!icao) return null;
  const p = icao.toUpperCase().slice(0,2);
  if(p==="ED"||p==="ET") return "DE";
  if(p==="LO") return "AT";
  if(p==="LS") return "CH";
  return null;
}
function boardToMarket(f){
  const dirDep = f.direction==="departure";
  const other = dirDep ? f.destination : f.origin;
  const otherCode = other?.code || "???";
  const ll = CITY_LL[otherCode] || null;
  // Prefer ICAO-prefix country (covers every DACH airport), fall back to IATA map.
  const country = countryFromICAO(other?.code_icao) || CITY_COUNTRY[otherCode] || null;
  const otherFlag = country==="DE"?"🇩🇪":country==="AT"?"🇦🇹":country==="CH"?"🇨🇭":flagFor(otherCode);
  const rank = country==="DE"?0:country==="AT"?1:country==="CH"?2:3;
  // Phase of the flight. Decide upcoming vs already-gone by the scheduled time
  // vs now (most reliable), refined by the status text. Do NOT use the presence
  // of a predicted/revised time — AeroDataBox provides that for upcoming flights
  // too, which previously made everything look "departed".
  // Category is time-based: before scheduled departure = upcoming (startet bald),
  // after = gestartet. Within gestartet, status (and how long ago) splits
  // landed vs en route. A flight whose scheduled time is long past but which
  // only has the AeroDataBox plan (AeroAPI has aged it out) almost certainly
  // landed already — don't leave it "unterwegs" forever or claim it's on time.
  const st = (f.status||"").toLowerCase();
  const relSched = dirDep ? f.scheduledDep : f.scheduledArr;
  const relTime = relSched ? new Date(relSched).getTime() : null;
  const now = Date.now();
  const adbOnly = (f.dataSource||"adb")==="adb";
  const longPast = relTime!=null && (now - relTime) > 90*60*1000; // >90 min after schedule
  let phase;
  if (f.cancelled || st.includes("cancel")) phase = "cancelled";
  else if (relTime == null) phase = "upcoming";
  else if (relTime > now) phase = "upcoming";
  else if (st.includes("arrived") || st.includes("landed") || st.includes("gate arrival")) phase = "landed";
  else if (adbOnly && longPast) phase = "landed"; // aged-out: assume landed, delay unknown
  else phase = "enroute"; // departed / in the air, not yet landed
  const settled = phase==="landed" || phase==="cancelled";

  // Betting closes 90 min BEFORE scheduled departure — so every bet is a real
  // prediction (the board hasn't yet revealed the delay) and a long, suspenseful
  // watch-phase remains. After that, the market is locked even though the flight
  // hasn't left yet.
  const BET_LEAD_MS = 90*60*1000;
  const betCloseTs = relTime!=null ? relTime - BET_LEAD_MS : null;
  const bettable = phase==="upcoming" && betCloseTs!=null && now < betCloseTs;

  // Three tabs: aktiv (still bettable) · abgeflogen (closed, not yet landed) ·
  // gelandet (landed or cancelled — resolved).
  const tab = (phase==="landed"||phase==="cancelled") ? "gelandet"
            : bettable ? "aktiv"
            : "abgeflogen";

  // If we only have the ADB plan for a flight that's already gone, we don't
  // actually know the delay — show "—" rather than a misleading +0m.
  const delayUnknown = adbOnly && relTime!=null && relTime <= now && (f.delayMin==null || f.delayMin===0) && !st.includes("delay");
  const effDelay = delayUnknown ? null : f.delayMin;
  const status = f.cancelled ? "bad"
    : effDelay==null ? "good"
    : effDelay>=60 ? "bad" : effDelay>=30 ? "warn" : effDelay>=15 ? "mid" : "good";
  const delayLabel = f.cancelled ? "ANNULLIERT"
    : effDelay==null ? (delayUnknown ? "k. A." : "—") : (effDelay>=0?"+":"")+effDelay+"m";
  const pools = poolsFor(f.ident, f.delayMin, f.cancelled);
  const fmtT = iso => {
    if (!iso) return "—";
    try {
      return new Date(iso).toLocaleTimeString("de-DE", { timeZone:"Europe/Berlin", hour:"2-digit", minute:"2-digit", hour12:false });
    } catch(e) { return new Date(iso).toISOString().slice(11,16); }
  };
  // Short Berlin-date label for the card, e.g. "So, 15. Juni".
  const fmtD = iso => {
    if (!iso) return "";
    try {
      return new Date(iso).toLocaleDateString("de-DE", { timeZone:"Europe/Berlin", weekday:"short", day:"numeric", month:"long" });
    } catch(e) { return ""; }
  };
  // ID must be unique PER FLIGHT INSTANCE, not just per flight number — otherwise
  // every day's "LH181" shares one id, and a single settlement record would mark
  // all future LH181 as settled (and block their payouts). Include the scheduled
  // departure date (Berlin) so each day's flight is distinct.
  const idDate = (() => {
    const iso = f.scheduledDep || f.scheduledArr;
    if (!iso) return "x";
    try { return new Date(iso).toLocaleDateString("en-CA", { timeZone: "Europe/Berlin" }); } // YYYY-MM-DD
    catch(e){ return "x"; }
  })();
  return {
    id: "bd_"+f.ident+"_"+idDate,
    type: "flight",
    live: true,
    phase,
    settled,
    bettable,
    tab,
    dateLabel: fmtD(dirDep ? f.scheduledDep : f.scheduledArr),
    betCloseISO: betCloseTs!=null ? new Date(betCloseTs).toISOString() : null,
    delayUnknown,
    dataSource: f.dataSource || "adb",
    code: f.ident,
    subcode: (f.operator||"") + " · " + (dirDep?"ab BER":"an BER"),
    liveIdent: f.identICAO || f.ident,
    direction: f.direction,
    geoRank: rank,
    otherCode,
    from: dirDep ? {cc:"DE",flag:"🇩🇪",name:"Berlin BER",dep:fmtT(f.scheduledDep)} : {cc:"",flag:otherFlag,name:other?.name||otherCode,dep:fmtT(f.scheduledDep)},
    to:   dirDep ? {cc:"",flag:otherFlag,name:other?.name||otherCode} : {cc:"DE",flag:"🇩🇪",name:"Berlin BER"},
    fromLL: dirDep ? BER_LL : ll,
    toLL:   dirDep ? ll : BER_LL,
    schedArr: fmtT(f.scheduledArr),
    actualArr: f.actualArr ? fmtT(f.actualArr) : "",
    depISO: f.scheduledDep || null,
    arrISO: f.scheduledArr || null,
    stops: 0,
    status,
    delay: delayLabel,
    risk: Math.round(pools.slice(1).reduce((a,b)=>a+b,0) / pools.reduce((a,b)=>a+b,0) * 100),
    dist: status==="bad"?[8,7,5,4,4,6,9,13,16,15,11,7,4,3,2]
         : status==="warn"?[10,9,9,10,12,13,11,9,6,4,3,2,2,1,1]
         : status==="mid"?[6,11,16,15,11,8,6,5,5,5,4,3,2,2,1]
         : [22,17,11,6,4,3,2,2,2,2,3,2,2,2,1],
    marker: status==="bad"?9:status==="warn"?5:status==="mid"?3:1,
    axis:["0m","30m","60m","90m","120m"],
    outcomes:[
      {id:"a",label:"Pünktlich",tone:"good",pool:pools[0]},
      {id:"b",label:"+15m",tone:"mid",pool:pools[1]},
      {id:"c",label:"+30m",tone:"warn",pool:pools[2]},
      {id:"d",label:"+60m",tone:"bad",pool:pools[3]},
    ],
    settles:"FlightAware · tatsächliche Ankunft am Gate",
  };
}

function useBoard(){
  const [flights, setFlights] = useState([]);
  const [status, setStatus] = useState(CONFIG.API_BASE ? "connecting" : "demo");
  const [lastUpdate, setLastUpdate] = useState(null);
  useEffect(()=>{
    if (!CONFIG.API_BASE){ setStatus("demo"); return; }
    let dead=false;
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    async function tryFetch(){
      const r = await fetch(`${CONFIG.API_BASE}/api/board?code=EDDB`);
      if(!r.ok) throw new Error(r.status);
      const d = await r.json();
      if(dead) return false;
      setFlights((d.flights||[]).map(boardToMarket));
      setLastUpdate(Date.now());
      setStatus("live");
      return true;
    }
    // Initial load: retry a few times (cold worker / slow network) while staying
    // in "connecting" — only declare "offline" after several real failures.
    async function initialLoad(){
      for(let i=0;i<3;i++){
        if(dead) return;
        try{ if(await tryFetch()) return; }catch(e){}
        if(dead) return;
        await sleep(1200*(i+1));
      }
      if(!dead) setStatus("offline");
    }
    initialLoad();
    // Periodic refresh: on success update to live; on a single miss leave the
    // current status as-is (don't flash offline over already-loaded data).
    const h=setInterval(()=>{ tryFetch().catch(()=>{}); }, 15*60*1000);
    return ()=>{ dead=true; clearInterval(h); };
  },[]);
  return { flights, status, lastUpdate };
}

// Shared pools (sum of all players' stakes) + settled markets. Refreshed more
// often than the board, since pools move with every bet. `bump` forces a refetch
// right after the user places a bet.
function usePools(bump){
  const [pools, setPools] = useState({});
  const [settled, setSettled] = useState({});
  useEffect(()=>{
    if(!CONFIG.API_BASE) return;
    let dead=false;
    async function tick(){
      try{
        const r = await fetch(`${CONFIG.API_BASE}/api/pools`);
        if(!r.ok) return;
        const d = await r.json();
        if(dead) return;
        setPools(d.pools||{}); setSettled(d.settled||{});
      }catch(e){}
    }
    tick();
    const h=setInterval(tick, 60*1000); // every minute
    return ()=>{ dead=true; clearInterval(h); };
  },[bump]);
  return { pools, settled };
}

// Morning-line source: per-route and per-flight-number delay history from the
// worker (D1 only, no paid API). Fetched once on load + hourly. Used to build a
// data-driven opening line per flight via blendSeed(). Empty {} until enough
// history is collected — blendSeed then just returns the default line.
function useMorningLine(){
  const [ml, setMl] = useState({ byDest:{}, byIdent:{} });
  useEffect(()=>{
    if(!CONFIG.API_BASE) return;
    let dead=false;
    async function load(){
      try{
        const r = await fetch(`${CONFIG.API_BASE}/api/morning-line`);
        if(!r.ok) return;
        const d = await r.json();
        if(dead) return;
        setMl({ byDest: d.byDest||{}, byIdent: d.byIdent||{} });
      }catch(e){}
    }
    load();
    const h=setInterval(load, 60*60*1000); // hourly — history changes slowly
    return ()=>{ dead=true; clearInterval(h); };
  },[]);
  return ml;
}

function useRouteStats(dest){
  const [stats,setStats]=useState(null);
  useEffect(()=>{
    if(!dest || !CONFIG.API_BASE){ setStats(null); return; }
    let dead=false;
    (async()=>{
      try{
        const r=await fetch(`${CONFIG.API_BASE}/api/route-stats?dest=${encodeURIComponent(dest)}`);
        const d=await r.json();
        if(!dead) setStats(d && !d.error ? d : null);
      }catch(e){ if(!dead) setStats(null); }
    })();
    return ()=>{ dead=true; };
  },[dest]);
  return stats;
}

// Leaderboard — fetched when the Rangliste tab is open (and refreshed on bump).
function useLeaderboard(active, bump){
  const [players,setPlayers]=useState(null); // null = loading
  useEffect(()=>{
    if(!active || !CONFIG.API_BASE) return;
    let dead=false;
    (async()=>{
      try{
        const r = await fetch(`${CONFIG.API_BASE}/api/leaderboard`);
        const d = await r.json();
        if(!dead) setPlayers(d.players||[]);
      }catch(e){ if(!dead) setPlayers([]); }
    })();
    return ()=>{ dead=true; };
  },[active,bump]);
  return players;
}

// Server-side wallet for this player.
// Current access token (JWT) for authenticated worker calls, or null.
async function authToken(){
  if(!sb) return null;
  const { data } = await sb.auth.getSession();
  return data?.session?.access_token || null;
}
// fetch() wrapper that attaches the Supabase bearer token when signed in.
async function authedFetch(url, opts={}){
  const t = await authToken();
  const headers = {...(opts.headers||{})};
  if(t) headers["Authorization"] = "Bearer "+t;
  return fetch(url, {...opts, headers});
}

// Tracks the Supabase session. Returns the current user (or null) + helpers.
function useAuth(){
  const [user, setUser] = useState(null);
  const [ready, setReady] = useState(!sb); // if no sb configured, we're "ready" (anonymous)
  useEffect(()=>{
    if(!sb) return;
    let dead=false;
    sb.auth.getSession().then(({data})=>{ if(!dead){ setUser(data?.session?.user||null); setReady(true); } });
    const { data: sub } = sb.auth.onAuthStateChange((_e, session)=>{ if(!dead) setUser(session?.user||null); });
    return ()=>{ dead=true; sub?.subscription?.unsubscribe?.(); };
  },[]);
  return { user, ready,
    signOut: ()=> sb && sb.auth.signOut(),
    google: ()=> sb && sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: REDIRECT_URL } }),
  };
}

  },[bump, user]);
  return w;
}

// Smoothly animates a number from its previous value to the new one (the
// "rolling counter" the article calls a key micro-interaction). Used for the
// balance so it ticks up/down instead of snapping.
// Lightweight sound engine (Web Audio — synthesized, no files). Short, quiet,
// mutable. Context is created lazily on the first user gesture (browser policy).
const Sound = (()=>{
  let ctx=null, muted=false;
  try{ muted = localStorage.getItem("berbet_muted")==="1"; }catch(_){}
  function ac(){
    if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} }
    if(ctx && ctx.state==="suspended"){ ctx.resume().catch(()=>{}); }
    return ctx;
  }
  function tone(freq,t0,dur,type,peak){
    const c=ac(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    const start=c.currentTime+t0;
    g.gain.setValueAtTime(0,start);
    g.gain.linearRampToValueAtTime(peak||0.1,start+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
    o.connect(g); g.connect(c.destination);
    o.start(start); o.stop(start+dur+0.02);
  }
  function buzz(pattern){ try{ navigator.vibrate && navigator.vibrate(pattern); }catch(_){} }
  return {
    get muted(){ return muted; },
    setMuted(v){ muted=v; try{ localStorage.setItem("berbet_muted", v?"1":"0"); }catch(_){} },
    select(){ buzz(8); if(muted) return; tone(880,0,0.05,"sine",0.04); },
    bet(){ buzz(30); if(muted) return; tone(620,0,0.07,"triangle",0.09); tone(990,0.06,0.12,"triangle",0.09); },
    win(){ buzz([20,40,30]); if(muted) return; [523,659,784,1047].forEach((f,i)=>tone(f,i*0.09,0.18,"triangle",0.1)); },
    lose(){ buzz(15); if(muted) return; tone(300,0,0.2,"sine",0.07); },
    streak(){ buzz([10,30,10]); if(muted) return; tone(500,0,0.1,"triangle",0.07); tone(760,0.08,0.1,"triangle",0.07); tone(1120,0.16,0.16,"triangle",0.08); },
  };
})();

function RollingNumber({ value, className, format }){
  const [shown,setShown]=useState(value);
  const fromRef=useRef(value), rafRef=useRef(null);
  useEffect(()=>{
    const from=fromRef.current, to=value, dur=600, t0=performance.now();
    if(from===to) return;
    cancelAnimationFrame(rafRef.current);
    const step=(t)=>{
      const p=Math.min(1,(t-t0)/dur);
      const eased=1-Math.pow(1-p,3); // ease-out cubic
      setShown(from+(to-from)*eased);
      if(p<1) rafRef.current=requestAnimationFrame(step);
      else { fromRef.current=to; setShown(to); }
    };
    rafRef.current=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(rafRef.current);
  },[value]);
  const out = format ? format(shown) : fmt(Math.round(shown));
  return <span className={className}>{out}</span>;
}

// Full-screen confetti + checkmark burst on a successful bet. `big` adds extra
// flair for a player's first-ever bet. Auto-dismisses.
function BetCelebration({ data, onDone }){
  useEffect(()=>{
    if(!data) return;
    const t=setTimeout(onDone, data.big?4200:3400);
    return ()=>clearTimeout(t);
  },[data]);
  if(!data) return null;
  const colors=["#22c55e","#3b82f6","#f59e0b","#ef4444","#a855f7"];
  const n=data.big?80:48;
  const bits=Array.from({length:n},(_, i)=>({
    left:Math.random()*100, delay:Math.random()*0.8,
    rot:Math.random()*360, col:colors[i%colors.length],
    dur:2.2+Math.random()*1.6,
  }));
  return <div className="celebrate" onClick={onDone}>
    <div className="celebrate-card">
      <div className="celebrate-check">✓</div>
      <div className="celebrate-t">{data.big?"Erste Wette platziert! 🎉":"Wette platziert!"}</div>
      <div className="celebrate-s">{fmt(data.stake)} € auf „{data.label}"</div>
    </div>
    {bits.map((b,i)=><span key={i} className="confetti" style={{
      left:b.left+"%", background:b.col,
      animationDelay:b.delay+"s", animationDuration:b.dur+"s",
      transform:`rotate(${b.rot}deg)`,
    }}/>)}
  </div>;
}

      <div className="stat"><div className="stat-v">{hitRate}%</div><div className="stat-l">Trefferquote</div></div>
      <div className="stat"><div className="stat-v">{betsWon}/{betsTotal}</div><div className="stat-l">Wetten gewonnen</div></div>

      <div className="stat"><div className="stat-v">{fmt(won)} €</div><div className="stat-l">Zurückgewonnen</div></div>
      <div className="stat"><div className="stat-v" style={{color:netBets>=0?"var(--good)":"var(--bad)"}}>{netBets>=0?"+":""}{fmt(netBets)} €</div><div className="stat-l">Bilanz aus Wetten</div></div>
      <div className="stat"><div className="stat-v">{open.length}</div><div className="stat-l">Offene Wetten</div></div>
    </div>

    <div className="panelbox">
      <div className="sectlbl">Offene Wetten {open.length>0 && `· ${fmt(openStake)} € im Spiel`}</div>
      {open.length===0
        ? <div className="prof-empty">Keine offenen Wetten. Setz auf einen Flug, um loszulegen.</div>

}
