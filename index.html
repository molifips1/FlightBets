// Quick-bet bottom sheet (bahn.bet style): chips for the stake, the four
// brackets to pick, an honest payout estimate, and a big place button. Slides
// up from the bottom on mobile; centers on desktop.
function BetSheet({ market, initialOutcome, wallet, onBet, onClose }){
  const CHIPS=[5,10,20,50,100,200];
  const [oid,setOid]=useState(initialOutcome || (market.outcomes[0]?.id));
  const firstAffordable = CHIPS.find(c=>c<=wallet) || CHIPS[0];
  const [stake,setStake]=useState(wallet>=50?50:firstAffordable);
  const o = market.outcomes.find(x=>x.id===oid) || market.outcomes[0];
  const total = market.outcomes.reduce((s,x)=>s+x.pool,0);
  // Honest payout estimate on the REAL pools (the seed only feeds the × display).
  const proj = (oo,st)=>{ if(!oo) return 0; const np=(oo.pool||0)+st, nt=total+st; return (st/np)*nt*(1-RAKE); };
  const tooMuch = stake>wallet;
  const place=()=>{ if(tooMuch||stake<=0) return; onBet(market,o,stake); onClose(); };
  return <div className="sheet-bg" onClick={onClose}>
    <div className="sheet" onClick={e=>e.stopPropagation()}>
      <div className="sheet-grip"/>
      <div className="sheet-head">
        <div>
          <div className="sheet-code">{market.code}{market.subcode && <span className="subcode">{market.subcode}</span>}</div>
          <div className="sheet-route">{market.from?.name} → {market.to?.name}</div>
        </div>
        <button className="sheet-x" onClick={onClose} aria-label="Schließen">✕</button>
      </div>

      <div className="sheet-lbl">Einsatz wählen</div>
      <div className="chips-row">
        {CHIPS.map(c=><button key={c} disabled={c>wallet}
          className={"chip-coin"+(stake===c?" on":"")+(c>wallet?" dis":"")}
          onClick={()=>setStake(c)}>{c}<small>€</small></button>)}
      </div>

      <div className="sheet-lbl">Dein Tipp</div>
      <div className="sheet-brackets">
        {market.outcomes.map(x=>{
          const on=x.id===oid; const od=displayOdds(market.outcomes,x,market.seed);
          return <button key={x.id} className={"sheet-bk"+(on?" on":"")} onClick={()=>setOid(x.id)}>
            <span className="sheet-bk-dot" style={{background:TONE[x.tone]}}/>
            <span className="sheet-bk-name">{x.label}</span>
            <span className="sheet-bk-odds">{od!=null?od.toFixed(2)+"×":"—"}</span>
          </button>;
        })}
      </div>

      <div className="sheet-pay">
        <span>Bei Gewinn (geschätzt)</span>
        <b>{fmt(proj(o,Math.min(stake,wallet)))} €</b>
      </div>
      <button className="sheet-place" disabled={tooMuch||stake<=0} onClick={place}>
        {tooMuch ? "Nicht genug Guthaben" : `Wette platzieren — ${stake}€ auf ${o.label}`}
      </button>
    </div>
  </div>;
}


// Closed/settled flights shown as a compact table (instead of cards). Each row
// links to the flight's detail page. "Ergebnis" is the actual delay once known;
// the state badge shows whether it's just closed or already settled.
function ClosedTable({ rows, total, onOpen }){
  return <div className="ctable-wrap">
    <table className="ctable">
      <thead>
        <tr><th>Flug</th><th>Abflug</th><th>Ergebnis</th><th className="ta-r">Pool</th></tr>
      </thead>
      <tbody>
        {rows.map(m=>{
          const color = m.delayUnknown ? "var(--muted)" : TONE[m.status];
          return <tr key={m.id} onClick={()=>onOpen(m.id)}>
            <td>
              <div className="ct-code">{m.code}</div>
              <div className="ct-route">→ {m.to.name}</div>
            </td>
            <td>
              <div>{m.dateLabel || "—"}</div>
              <div className="ct-sub">{m.from.dep}</div>
            </td>
            <td>
              <span className="ct-res" style={{color}}>{m.delay}</span>
              <div className="ct-state">{m.settled ? "✓ Abgerechnet" : "🔒 Geschlossen"}</div>
            </td>
            <td className="ta-r">{fmt(total(m))} €</td>
          </tr>;
        })}
      </tbody>
    </table>
  </div>;
}

function App(){
  const [theme,setTheme]=useState(()=>store.get("fb_theme","light"));
  const [markets]=useState(SEED); // SEED now holds only daily questions; flights come live from the board
  const [bump,setBump]=useState(0); // increment to refetch pools+wallet after a bet
  const [tab,setTab]=useState("flights");
  const { pools: serverPools, settled: serverSettled } = usePools(bump);
  const { user, ready: authReady, signOut } = useAuth();
  const serverWallet = useWallet(bump, user);
  const wallet = serverWallet.balance;
  const leaderboard = useLeaderboard(tab==="rank", bump);
  const [authOpen,setAuthOpen]=useState(false);
  const [view,setView]=useState({page:"home"});
  const [openBet,setOpenBet]=useState(null);
  const [pick,setPick]=useState(null);
  const [stake,setStake]=useState(100);
  const [ops,setOps]=useState(false);
  const [toast,setToast]=useState(null);
  const [celebrate,setCelebrate]=useState(null);
  const [muted,setMuted]=useState(Sound.muted);
  const [menuOpen,setMenuOpen]=useState(false);
  const [betSheet,setBetSheet]=useState(null); // {marketId, outcomeId} for the quick-bet sheet
  const onQuickBet=(mid,oid)=>{ setBetSheet({marketId:mid, outcomeId:oid}); };
  // --- Browser back/forward support (no URL change) ----------------------
  // Mirror the navigation state (tab / view / menu) into the History API so the
  // browser's back button reverses the last in-app navigation. We push an entry
  // on each change and restore state on popstate, guarding against loops.
  const histInit=useRef(false);
  const fromPop=useRef(false);
  useEffect(()=>{
    const snap={tab,view,menuOpen};
    if(!histInit.current){ histInit.current=true; try{history.replaceState(snap,"");}catch(_){}; return; }
    if(fromPop.current){ fromPop.current=false; return; }
    try{ history.pushState(snap,""); }catch(_){}
  },[tab,view.page,view.id,menuOpen]);
  useEffect(()=>{
    const onPop=(e)=>{
      const s=e.state||{tab:"flights",view:{page:"home"},menuOpen:false};
      fromPop.current=true;
      setTab(s.tab||"flights");
      setView(s.view||{page:"home"});
      setMenuOpen(!!s.menuOpen);
      setOpenBet(null);
    };
    window.addEventListener("popstate",onPop);
    return ()=>window.removeEventListener("popstate",onPop);
  },[]);
  const [streakWelcome,setStreakWelcome]=useState(null);
  const [results,setResults]=useState(null);
  const streak = serverWallet.streak || 0;
  const checkedForRef = useRef(null);
  useEffect(()=>{
    if(!user || !CONFIG.API_BASE) return;
    if(checkedForRef.current===user.id) return; // once per signed-in user
    checkedForRef.current = user.id;
    (async()=>{
      try{
        const r = await authedFetch(`${CONFIG.API_BASE}/api/checkin`, { method:"POST" });
        const d = await r.json();
        if(d && !d.error){
          if(!d.already && d.bonus>0){
            setStreakWelcome({ streak:d.streak, bonus:d.bonus });
            Sound.streak();
          }
          setBump(b=>b+1); // refresh wallet (new balance + streak)
        }
      }catch(_){}
      // Then surface any settled results since last visit.
      try{
        const rr = await authedFetch(`${CONFIG.API_BASE}/api/results`, { method:"POST" });
        const dd = await rr.json();
        if(dd && dd.count>0){ setResults(dd); setBump(b=>b+1); }
      }catch(_){}
    })();
  },[user]);
  const [phaseFilter,setPhaseFilter]=useState("aktiv"); // aktiv | geschlossen

  useEffect(()=>{document.documentElement.setAttribute("data-theme",theme);store.set("fb_theme",theme)},[theme]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(null),2600);return()=>clearTimeout(t)},[toast]);

  const total=m=>m.outcomes.reduce((s,o)=>s+o.pool,0);

  // Live BER board → bettable markets.
  const { flights: boardFlights, status: dataStatus, lastUpdate } = useBoard();

  // Apply the REAL shared pools from the server onto each market, and mark a
  // market settled if the server has resolved it. Pools start at €0 and grow as
  // players actually bet — no synthetic numbers.
  const mergeStakes = (mkt) => {
    const p = serverPools[mkt.id] || {};
    const outcomes = mkt.outcomes.map(o => ({...o, pool: p[o.id] || 0}));
    const set = serverSettled[mkt.id];
    const settled = mkt.settled || !!set;
    return {...mkt, outcomes, settled,
            bettable: settled ? false : mkt.bettable, // settled ⇒ never bettable
            settledOutcome: set ? set.outcome : null};
  };
  const morningLine = useMorningLine();
  const liveMarkets = boardFlights.map(mergeStakes).map(m => ({ ...m, seed: blendSeed(morningLine, m.code, m.otherCode) }));
  const dailyMarkets = markets.filter(m => m.type==="daily").map(mergeStakes);
  const allFindable = [...liveMarkets, ...dailyMarkets];

  const dataPill = dataStatus === "live"    ? { t:"LIVE",    bg:"var(--good)", fg:"#fff" }
                 : dataStatus === "demo"    ? { t:"DEMO",    bg:"var(--card2)", fg:"var(--muted)" }
                 : dataStatus === "offline" ? { t:"OFFLINE", bg:"var(--bad)",  fg:"#fff" }
                 :                            { t:"…",       bg:"var(--card2)", fg:"var(--muted)" };

  async function onBet(m,o,betStake){
    const s = (betStake!=null) ? betStake : stake;
    if(!user){ setAuthOpen(true); setToast("Zum Wetten bitte anmelden"); return; }
    if(s<=0||s>wallet)return;
    if(!CONFIG.API_BASE){ setToast("Kein Server verbunden"); return; }
    try{
      const r = await authedFetch(`${CONFIG.API_BASE}/api/bet`, {
        method:"POST", headers:{"content-type":"application/json"},
        body: JSON.stringify({ flightId: m.id, ident: m.code, direction: m.direction, outcome: o.id, stake: s }),
      });
      const d = await r.json();
      if(d.error){
        setToast(d.error==="insufficient_funds"?"Nicht genug Guthaben":d.error==="market_settled"?"Markt bereits abgerechnet":d.error==="betting_closed"?"Wetten für diesen Flug sind geschlossen":d.error==="unauthorized"?"Bitte neu anmelden":"Wette fehlgeschlagen");
        return;
      }
      // Success — celebrate. First-ever bet (no prior settled/placed) gets extra flair.
      const firstBet = (serverWallet.balance>=925 && (serverWallet.staked||0)===0);
      Sound.bet();
      setCelebrate({ stake: s, label:o.label, big:firstBet });
      setBump(b=>b+1); // refetch pools + wallet
    }catch(e){ setToast("Wette fehlgeschlagen — Server nicht erreichbar"); }
  }
  // Settlement is automatic on the server. The OPS button is gone.
  function onSettle(){ setToast("Abrechnung läuft automatisch nach der Landung."); }
  function reset(){ setToast("Guthaben wird serverseitig geführt und nicht mehr lokal zurückgesetzt."); }

  const displayName = user ? (user.user_metadata?.name || user.email?.split("@")[0] || "Konto") : null;
  const betProps={openBet,setOpenBet,pick,setPick,stake,setStake,wallet,onBet,ops,onSettle,onQuickBet};
  const detailMarket=view.page==="detail"?allFindable.find(m=>m.id===view.id):null;

  return <div className="app">
    <div className="top">
      <div className="wm" role="button" title="Zu den wettbaren Flügen" onClick={()=>{setTab("flights");setView({page:"home"});setPhaseFilter("aktiv");setMenuOpen(false);}}><span className="plane">✈</span>flug<span className="pin">.</span>bet</div>
      <div className="topr">
        <span className="chip" title={lastUpdate?`Aktualisiert ${new Date(lastUpdate).toLocaleTimeString()}`:"Noch keine Daten"} style={{background:dataPill.bg,color:dataPill.fg,borderColor:dataPill.bg}}>
          <span style={{width:6,height:6,borderRadius:"50%",background:dataPill.fg,display:"inline-block",opacity:.9}}/>
          {dataPill.t}
        </span>
        {user ? <>
          {streak>0 && <span className="chip streak" title={`${streak} Tage in Folge`}>🔥 {streak}</span>}
          <span className="chip bal">€ <RollingNumber value={wallet}/></span>
          <button className="chip" style={{cursor:"pointer"}} onClick={()=>setTab("profile")} title="Meine Wetten & Statistik">🎫 Meine Wetten</button>
          <button className="avatar" onClick={()=>setMenuOpen(o=>!o)}/>
        </> : (
          <>
            <button className="chip" style={{cursor:"pointer",background:"var(--brand)",color:"#fff",borderColor:"var(--brand)",fontWeight:700}} onClick={()=>setAuthOpen(true)}>Anmelden</button>
            <button className="avatar" onClick={()=>setMenuOpen(o=>!o)}/>
          </>
        )}
      </div>
    </div>

    {menuOpen && <>
      <div className="menu-backdrop" onClick={()=>setMenuOpen(false)}/>
      <div className="menu-pop">
        {user ? (
          <div className="menu-head">
            <div className="menu-av">{(displayName||"?")[0].toUpperCase()}</div>
            <div className="menu-id">
              <div className="menu-name">{displayName}</div>
              <div className="menu-role">FLUGGAST</div>
            </div>
          </div>
        ) : (
          <div className="menu-head"><div className="menu-id"><div className="menu-name">Nicht angemeldet</div><div className="menu-role">Gast</div></div></div>
        )}
        {user && <div className="menu-pills">
          <div className="menu-pill"><span className="mp-v">€ {fmt(wallet)}</span><span className="mp-l">Guthaben</span></div>
          <div className="menu-pill"><span className="mp-v">Lvl {serverWallet.level||levelForXp(serverWallet.xp||0)}</span><span className="mp-l">{serverWallet.xp||0} XP</span></div>
        </div>}

        <div className="menu-list">
          {user && <button className="menu-item" onClick={()=>{setTab("profile");setMenuOpen(false);}}><span className="mi-i">🎫</span>Meine Wetten</button>}
          <button className="menu-item" onClick={()=>{setTab("settings");setMenuOpen(false);}}><span className="mi-i">⚙️</span>Einstellungen</button>
          <button className="menu-item" onClick={()=>{setTab("legal");setMenuOpen(false);}}><span className="mi-i">📄</span>Impressum &amp; Datenschutz</button>
          <button className="menu-item" onClick={()=>setToast("Über uns — bald verfügbar")}><span className="mi-i">ℹ️</span>Über uns<span className="mi-soon">bald</span></button>
          <button className="menu-item" onClick={()=>setToast("Fehler melden — bald verfügbar")}><span className="mi-i">🐞</span>Fehler melden<span className="mi-soon">bald</span></button>
          <button className="menu-item" onClick={()=>setToast("Weitere Sprachen — bald verfügbar")}><span className="mi-i">🌐</span>Sprache<span className="mi-soon">DE</span></button>

          <div className="menu-div"/>
          <button className="menu-item" onClick={()=>setTheme(t=>t==="light"?"dark":"light")}><span className="mi-i">{theme==="light"?"🌙":"☀️"}</span>Dunkler Modus<span className="mi-state">{theme==="dark"?"an":"aus"}</span></button>
          <button className="menu-item" onClick={()=>{const v=!muted;setMuted(v);Sound.setMuted(v);if(!v)Sound.select();}}><span className="mi-i">{muted?"🔇":"🔊"}</span>Ton<span className="mi-state">{muted?"aus":"an"}</span></button>

          {user && <>
            <div className="menu-div"/>
            <button className="menu-item danger" onClick={()=>{setMenuOpen(false);signOut();}}><span className="mi-i">↩</span>Abmelden</button>
          </>}
        </div>
        <div className="menu-foot">flug.bet · Spielgeld</div>
      </div>
    </>}

    {authOpen && <AuthModal onClose={()=>setAuthOpen(false)}/>}

    {tab==="settings" ? (
      <Settings user={user} theme={theme} setTheme={setTheme} muted={muted} setMuted={setMuted} signOut={signOut} setToast={setToast}/>
    ) : tab==="legal" ? (
      <Legal/>
    ) : tab==="profile" ? (
      <>
        <div className="rankhead">
          <h2>👤 Dein Profil</h2>
          <p>Deine Wett-Statistik und offene Wetten.</p>
        </div>
        <Profile wallet={serverWallet} user={user} streak={streak} markets={allFindable}
          onOpen={id=>{setTab("flights");setView({page:"detail",id});}}/>
      </>
    ) : tab==="rank" ? (
      <>
        <div className="rankhead">
          <h2>🏆 Rangliste</h2>
          <p>Beste Tipper nach Guthaben — wer aus den Start-925 € am meisten gemacht hat.</p>
        </div>
        <Leaderboard players={leaderboard} me={user?.id}/>
      </>
    ) : view.page==="home" ? <>
      <div className="ticker"><div className="ticker-track">
        {TICKER.concat(TICKER).map((t,i)=><span className="tk" key={i}><span className="win">+{t[2]}€</span><b>{t[0]}</b> auf {t[1]}</span>)}
      </div></div>

      <div className="subfilter">
        <button className={"subpill"+(phaseFilter==="aktiv"?" on":"")} onClick={()=>setPhaseFilter("aktiv")}>● Aktiv</button>
        <button className={"subpill"+(phaseFilter==="geschlossen"?" on":"")} onClick={()=>setPhaseFilter("geschlossen")}>🔒 Geschlossen</button>
      </div>

      {dataStatus!=="live" && <div className="emptyboard">
        {dataStatus==="connecting"
          ? <><span className="spin spin-d"/> Lade die Live-Tafel vom BER…</>
          : dataStatus==="offline"
          ? "Die Live-Tafel ist gerade nicht erreichbar. Der Worker antwortet nicht — Daten erscheinen, sobald er wieder läuft."
          : "Kein Live-Worker verbunden. Trag deine Worker-URL in CONFIG.API_BASE ein, um die echte BER-Tafel zu laden."}
      </div>}

      {(() => {
        const closed = phaseFilter==="geschlossen";
        const shown = liveMarkets
          .filter(m => {
            if (closed) {
              if (m.tab!=="abgeflogen" && m.tab!=="gelandet") return false;
              // Hide pure noise: resolved flights whose result we never learned
              // (k. A.) AND that nobody bet on.
              if (m.delayUnknown && total(m)===0) return false;
              return true;
            }
            return m.tab==="aktiv";
          })
          .sort((a,b)=>{
            if (closed) {
              // A log of recently closed flights: newest departure first.
              return new Date(b.depISO || 0).getTime() - new Date(a.depISO || 0).getTime();
            }
            // Aktiv: most betting volume first (where the action is), then by time.
            const va = total(a), vb = total(b);
            if (vb !== va) return vb - va;
            return new Date(a.depISO || 0).getTime() - new Date(b.depISO || 0).getTime();
          });
        // Only show the empty state once data is actually loaded (not while connecting).
        if (dataStatus==="live" && shown.length===0) {
          const msg = closed
            ? { e1:"🔒", e2:"Keine geschlossenen Flüge", e3:"Hier erscheinen Flüge, deren Wettfenster geschlossen ist — mit Ergebnis, sobald sie gelandet und abgerechnet sind." }
            : { e1:"🕐", e2:"Gerade keine wettbaren Flüge",
                e3:"Wetten schließen 90 Minuten vor Abflug. Aktuell ist kein Flug im offenen Fenster — oft abends, wenn der Flugbetrieb am BER ausläuft. Schau später wieder vorbei." };
          return <div className="empty"><div className="e1">{msg.e1}</div><div className="e2">{msg.e2}</div><div className="e3">{msg.e3}</div></div>;
        }
        if (closed) return <ClosedTable rows={shown} total={total} onOpen={id=>setView({page:"detail",id})}/>;
        return <div className="grid">
          {shown.map(m=><MarketCard key={m.id} m={m} total={total(m)} onOpen={(id,pickId)=>{if(pickId)setPick(pickId);setView({page:"detail",id,pick:pickId||null});}} {...betProps}/>)}
        </div>;
      })()}
    </> : view.page==="daily" ? (
      <DailyPage markets={dailyMarkets} total={total} betProps={betProps}
        openDetail={id=>setView({page:"detail",id})}/>
    ) : detailMarket ? (
      <Detail m={detailMarket} total={total(detailMarket)} initialPick={view.pick} back={()=>{setView({page:"home"});setOpenBet(null)}} {...betProps}/>
    ) : null}

    <div className="nav">
      <button className={"navi"+(tab==="flights"?" on":"")} onClick={()=>{setTab("flights");setView({page:"home"})}}><span className="ni">🛫</span>Flüge</button>
      <button className={"navi"+(tab==="daily"?" on":"")} onClick={()=>{setTab("daily");setView({page:"daily"})}}><span className="ni">📅</span>Täglich</button>
      <button className="fab" onClick={()=>{setTab("flights");setView({page:"home"})}}>⚡</button>
      <button className={"navi"+(tab==="live"?" on":"")} onClick={()=>{setTab("live");setView({page:"home"})}}><span className="ni">📡</span>Live</button>
      <button className={"navi"+(tab==="rank"?" on":"")} onClick={()=>{setTab("rank")}}><span className="ni">🏆</span>Rangliste</button>
    </div>

    {toast && <div className="toast">{toast}</div>}
    {betSheet && (()=>{ const mk = allFindable.find(x=>x.id===betSheet.marketId); return mk
      ? <BetSheet market={mk} initialOutcome={betSheet.outcomeId} wallet={wallet} onBet={onBet} onClose={()=>setBetSheet(null)}/>
      : null; })()}
    <BetCelebration data={celebrate} onDone={()=>setCelebrate(null)}/>
    {streakWelcome && <div className="celebrate" onClick={()=>setStreakWelcome(null)}>
      <div className="celebrate-card">
        <div className="streak-flame">🔥</div>
        <div className="celebrate-t">{streakWelcome.streak} {streakWelcome.streak===1?"Tag":"Tage"} in Folge!</div>
        <div className="celebrate-s">Willkommen zurück · <b style={{color:"var(--good)"}}>+{streakWelcome.bonus} €</b> Bonus</div>
      </div>
    </div>}
    {!streakWelcome && <ResultsCelebration data={results} onDone={()=>setResults(null)}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
